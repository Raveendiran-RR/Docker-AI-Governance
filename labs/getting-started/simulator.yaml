  # brew trust — must come BEFORE brew-install-sbx (first-match-wins for [brew, trust])
  - id: brew-trust-tap
    when:
      command: [brew, trust]
      args:
        0: "docker/tap"
    then:
      output:
        - "==> Trusting docker/tap"
        - { text: "    ✓  Tap docker/tap is now trusted", delay: short }
        - "    ✓  Future installs from docker/tap will not trigger security warnings"

  # brew install — package name is positional arg 0, not part of command path
  - id: brew-install-sbx
    when:
      command: [brew, install]
      args:
        0: "docker/tap/sbx"
    then:
      state: { sbx_installed: true }
      output:
        - "==> Tapping docker/tap"
        - { text: "Cloning into '/usr/local/Homebrew/Library/Taps/docker/homebrew-tap'...", delay: clone }
        - "remote: Enumerating objects: 41, done."
        - "Tapped 3 formulae (43 files, 52.1KB)."
        - "==> Fetching docker/tap/sbx"
        - { text: "==> Downloading https://github.com/docker/sbx-cli/releases/download/v0.12.1/sbx_darwin_arm64.tar.gz", delay: pull }
        - "==> Installing sbx from docker/tap"
        - "  /usr/local/Cellar/sbx/0.12.1: 5 files, 18.7MB"
