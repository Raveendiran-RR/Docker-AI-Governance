  catalog-service-node/src/services/ProductService.js: |
    const { Client } = require("pg");

    const { getInventoryForProduct } = require("./InventoryService");
    const { uploadFile, getFile } = require("./StorageService");
    const { publishEvent } = require("./PublisherService");

    let client;
    async function getClient() {
      if (!client) {
        client = new Client();
        await client.connect();
      }
      return client;
    }

    async function getProducts() {
      const client = await getClient();

      const result = await client.query("SELECT * FROM products ORDER BY id ASC");

      return result.rows;
    }

    async function getProductById(id) {
      const client = await getClient();

      const result = await client.query("SELECT * FROM products WHERE id = $1", [
        id,
      ]);

      if (result.rows.length === 0) {
        return null;
      }

      const product = result.rows[0];

      const inventory = await getInventoryForProduct(product.upc);

      // BUG: multiplies price BY the discount rate instead of (1 - rate)
      // e.g. $100 at 20% off → should be $80, but shows $20
      product.final_price = product.price * product.discount_rate;

      return {
        inventory,
        ...product,
      };
    }

    module.exports = {
      getProducts,
      getProductById,
    };

  catalog-service-node/.github/workflows/ci.yml: |
    name: Catalog Service CI

    on:
      push:
        branches: [main, "fix/**"]
      pull_request:

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Build image
            run: docker build -t catalog-service-node:${{ github.sha }} .

          - name: Docker Scout — CVE scan
            uses: docker/scout-action@v1
            with:
              command: cves
              image: catalog-service-node:${{ github.sha }}
              only-severities: critical,high
              exit-code: true          # fails CI if critical/high found

          - name: Docker Scout — policy gate
            uses: docker/scout-action@v1
            with:
              command: policy
              image: catalog-service-node:${{ github.sha }}
              exit-code: true          # fails CI if any policy not satisfied

          - name: Push to registry
            if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
            run: docker push catalog-service-node:${{ github.sha }}

