        - "Use 'sbx [command] --help' for more information."

  - id: claude-start
    when:
      command: [claude]
    then:
      output:
        - "╭─────────────────────────────────────────────────────╮"
        - "│            Claude Code (inside sandbox)             │"
        - "│  Sandbox: sbx-claude-abc1  │  Org: {{ state.configured_org }}       │"
        - "│  Network: restricted       │  Audit: enabled         │"
        - "╰─────────────────────────────────────────────────────╯"
        - ""
        - "> What would you like to do?"

  # grep — flags go in args, pattern is positional arg 0 (spec §6.2)
  - id: grep-find-bug
    when:
      command: [grep]
      args:
        -rn: true
        0: "final_price"
    then:
      state: { bug_found: true }
      output:
        - "product-catalog/src/routes/products.js:29:      product.final_price = product.price * product.discount_rate;"

  - id: grep-find-discount
    when:
      command: [grep]
      args:
        -rn: true
        0: "discount"
    then:
      state: { bug_found: true }
      output:
        - "product-catalog/src/routes/products.js:22:        SELECT id, name, price, discount_rate, image_url, category"
        - "product-catalog/src/routes/products.js:29:      product.final_price = product.price * product.discount_rate;"

  - id: git-diff-fix
    when:
      command: [git, diff]
    then:
      state: { bug_fixed: true }
      output:
        - "diff --git a/product-catalog/src/routes/products.js b/product-catalog/src/routes/products.js"
        - "index 4f9a2c1..8e3d7b2 100644"
        - "--- a/product-catalog/src/routes/products.js"
        - "+++ b/product-catalog/src/routes/products.js"
        - "@@ -26,7 +26,7 @@ router.get('/:id', async (req, res) => {"
        - "   const product = result.rows[0];"
        - "   if (!product) return res.status(404).json({ error: 'Not found' });"
        - " "
        - "-  product.final_price = product.price * product.discount_rate;"
        - "+  product.final_price = product.price * (1 - product.discount_rate);"
        - " "
        - "   res.json(product);"
        - " });"

  - id: git-add
    when:
      command: [git, add]
      args:
        0: { any: true }
    then:
      output: []

  - id: git-commit
    when:
      command: [git, commit]
    then:
      output:
        - "[fix/discount-calculation 9a3c7f2] Fix discount calculation and upgrade to dhi.io/node:24-alpine"
        - " 2 files changed, 3 insertions(+), 3 deletions(-)"
        - " rename Dockerfile => Dockerfile.old (100%)"
        - " rename Dockerfile.dhi => Dockerfile (95%)"

  # git push — BEFORE fix; triggers CI failure (specific state condition takes priority)
  - id: git-push-fail
    when:
      command: [git, push]
      state: { image_patched: false }
    then:
      output:
        - "Enumerating objects: 5, done."
        - "Counting objects: 100% (5/5), done."
        - { text: "Writing objects: 100% (3/3), 892 bytes | 892.00 KiB/s, done.", delay: clone }
        - ""
        - "remote: Resolving deltas: 100% (1/1), done."
        - "To https://github.com/dockersamples/product-catalog.git"
        - "   abc1234..d3f9a12  main → main"
        - ""
        - "  ✗  CI triggered — pipeline failed at 'Docker Scout — CVE scan'"
        - "  ✗  3 critical, 11 high CVEs in node:18-alpine — image blocked from registry"
        - "  View run: https://github.com/dockersamples/product-catalog/actions/runs/..."
      ci:
        workflow: product-catalog-ci
        commit: "Initial push (node:18-alpine, pre-fix)"
        conclusion: failure
        failedStep: scout-cves
        error: "3 critical, 11 high CVEs detected — merge blocked."

  # git push — AFTER fix + DHI switch; triggers CI success (catch-all, image_patched = true)
  - id: git-push
    when:
      command: [git, push]
    then:
      output:
        - "Enumerating objects: 7, done."
        - "Counting objects: 100% (7/7), done."
        - { text: "Delta compression using up to 10 threads", delay: short }
        - "Compressing objects: 100% (4/4), done."
        - { text: "Writing objects: 100% (4/4), 1.23 KiB | 1.23 MiB/s, done.", delay: clone }
        - "Total 4 (delta 2), reused 0 (delta 0), pack-reused 0"
        - ""
        - "remote: Resolving deltas: 100% (2/2), completed with 2 local objects."
        - "To https://github.com/dockersamples/product-catalog.git"
        - "   abc1234..9a3c7f2  fix/discount-calculation → fix/discount-calculation"
        - ""
        - "  ✓  CI triggered: https://github.com/dockersamples/product-catalog/actions"
        - "  ✓  Docker Scout CVE scan: PASS (0 critical, 0 high)"
        - "  ✓  Docker Scout policy gate: PASS (5/5 policies)"
        - "  ✓  Image pushed to registry: dockersamples/product-catalog:9a3c7f2"
      ci:
        workflow: product-catalog-ci
        commit: "Fix discount calculation and upgrade to dhi.io/node:24-alpine"
