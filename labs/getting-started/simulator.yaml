  # ─────────────────────────────────────────
  # SECTION 4 — Sandboxes
  # ─────────────────────────────────────────

  # brew trust — must come BEFORE brew-install-sbx (first-match-wins for [brew, trust])
  - id: brew-trust-tap
    when:
      command: [brew, trust]
      args:
        0: "docker/tap"
    then:
      output:
        - "==> Trusting docker/tap"
        - { text: "    ✓  Tap docker/tap is now trusted", delay: short }
        - "    ✓  Future installs from docker/tap will not trigger security warnings"

  # brew install — package name is positional arg 0, not part of command path
  - id: brew-install-sbx
    when:
      command: [brew, install]
      args:
        0: "docker/tap/sbx"
    completes: sbx-installed
    then:
      state: { sbx_installed: true }
      output:
        - "==> Tapping docker/tap"
        - { text: "Cloning into '/usr/local/Homebrew/Library/Taps/docker/homebrew-tap'...", delay: clone }
        - "remote: Enumerating objects: 41, done."
        - "Tapped 3 formulae (43 files, 52.1KB)."
        - "==> Fetching docker/tap/sbx"
        - { text: "==> Downloading https://github.com/docker/sbx-cli/releases/download/v0.12.1/sbx_darwin_arm64.tar.gz", delay: pull }
        - "==> Installing sbx from docker/tap"
        - "  /usr/local/Cellar/sbx/0.12.1: 5 files, 18.7MB"
        - ""
        - "Run 'sbx --help' to get started."
        - "Docs: https://docs.docker.com/ai/sandboxes/"

  # sbx subcommands — ALL specific ones BEFORE the bare `sbx` catch-all

  # sbx login — BEFORE the catch-all (first-match-wins; [sbx, login] is more specific than [sbx])
  - id: sbx-login
    completes: sbx-logged-in
    when:
      command: [sbx, login]
    then:
      output:
        - "Opening browser for Docker Hub authentication..."
        - { text: "    ✓  Authenticated as raveendiran.ramshankar@docker.com", delay: short }
        - { text: "    ✓  Organization: {{ state.configured_org }}", delay: short }
        - "    ✓  sbx CLI logged in — sandboxes will inherit org policies"

  # sbx secret set — BEFORE the catch-all
  - id: sbx-secret-set
    when:
      command: [sbx, secret, set]
      args:
        0: { any: true }
        1: { any: true }
    then:
      output:
        - "    ✓  Secret '{{ args.1 }}' stored for sandbox '{{ args.0 }}'"
        - "    ✓  Value is held by the host-side credential proxy"
        - "    ✓  The token is never written into the sandbox or its environment variables"

  - id: sbx-version
    when:
      command: [sbx, version]
    then:
      output:
        - "sbx version 0.12.1"
        - "  platform: darwin/arm64"
        - "  runtime: microvm (Apple Virtualization Framework)"
        - "  docs: https://docs.docker.com/ai/sandboxes/"

  # sbx policy ls — org mode (default, sbx_policy_mode = "org")
  # sbx policy ls --type filesystem — MUST come before the bare sbx-policy-ls-* (more specific first)
  - id: sbx-policy-ls-filesystem-org
    when:
      command: [sbx, policy, ls]
      args:
        --type: "filesystem"
      state: { sbx_policy_mode: "org" }
    then:
      output:
        - "  POLICY                                 SOURCE   APPLIES TO   SUMMARY"
        - "  org-default                            org      all          filesystem read: 1 allow, 1 deny; filesystem write: 1 allow, 1 deny"
        - ""
        - "  1 policy active (source: org — {{ state.configured_org }})"
        - "  allow = the project workspace only; deny = every other host path."
        - "  Extra read-only mounts are added at 'sbx run <path>:ro' time — there's"
        - "  no 'sbx policy allow/deny filesystem' command."

  - id: sbx-policy-ls-filesystem-local
    when:
      command: [sbx, policy, ls]
      args:
        --type: "filesystem"
      state: { sbx_policy_mode: "local" }
    then:
      output:
        - "  POLICY                                 SOURCE   APPLIES TO   SUMMARY"
        - "  local-policy                           local    all          filesystem read: 1 allow, 1 deny; filesystem write: 1 allow, 1 deny"
        - ""
        - "  1 policy active (source: local)"
        - "  Same minimal default as org mode — only the workspace is mounted."

  - id: sbx-policy-ls-org
    when:
      command: [sbx, policy, ls]
      state: { sbx_policy_mode: "org" }
    then:
      output:
        - "  POLICY                                 SOURCE   APPLIES TO   SUMMARY"
        - "  org-default                            org      all          network: 0 allow, 1 deny (default-deny); filesystem read: 0 allow, 1 deny; filesystem write: 0 allow, 1 deny"
        - "  local-policy                           local    all          network: 2 allow (github.com, pypi.org); filesystem read: 1 allow; filesystem write: 1 allow"
        - ""
        - "  2 policies active (source: org — {{ state.configured_org }})"
        - "  Manage at: https://hub.docker.com/orgs/{{ state.configured_org }}/scout/sandboxes"
        - ""
        - "  Note: MCP access and audit logging are governed separately — MCP by the"
        - "  sandbox's MCP gateway (org-managed, no local 'sbx policy' toggle), audit"
        - "  via 'sbx policy log' and the org's Docker Hub audit dashboard."

  # sbx policy ls — local mode (sbx_policy_mode = "local")
  - id: sbx-policy-ls-local
    when:
      command: [sbx, policy, ls]
      state: { sbx_policy_mode: "local" }
    then:
      output:
        - "  POLICY                                 SOURCE   APPLIES TO   SUMMARY"
        - "  local-policy                           local    all          network: 2 allow (github.com, pypi.org), 0 deny; filesystem read: 1 allow; filesystem write: 1 allow"
        - ""
        - "  1 policy active (source: local)"
        - "  No org policies applied — sandbox is not connected to a Docker Hub org."
        - "  Tip: log in with 'sbx login' to activate org governance."

  # Domain is positional arg 0 — template substitution via {{ args.0 }}
  - id: sbx-policy-allow-network
    when:
      command: [sbx, policy, allow, network]
      args:
        0: { any: true }
    then:
      output:
        - "    ✓  Network policy updated"
        - "       Allowed: {{ args.0 }}"
        - "       Scope: this sandbox session"
        - ""
        - "    Note: Org-level policies still enforce the global allowlist."
        - "    Admins can lock this with 'sbx policy lock network' to prevent overrides."

  # sbx policy check network <domain> — real subcommand, dry-runs a policy decision without a live sandbox
  - id: sbx-policy-check-network-allowed
    when:
      command: [sbx, policy, check, network]
      args:
        0: "github.com"
    then:
      output:
        - "  RESOURCE      DECISION  MATCHED RULE"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  github.com    ALLOW     default-allow-network (source: local, added by you)"
        - ""
        - "  ✓  github.com would be reachable from a sandbox right now."

  - id: sbx-policy-check-network-denied
    when:
      command: [sbx, policy, check, network]
      args:
        0: { any: true }
    then:
      output:
        - "  RESOURCE               DECISION  MATCHED RULE"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  {{ args.0 }}    DENY      default-deny-network (source: org — {{ state.configured_org }})"
        - ""
        - "  ✗  {{ args.0 }} would be blocked — no allow rule matches it."

  # sbx policy log — real subcommand for per-sandbox activity (no `sbx audit` in the real CLI)
  - id: sbx-policy-log
    when:
      command: [sbx, policy, log]
    then:
      output:
        - "Blocked requests:"
        - "SANDBOX          TYPE      HOST                 PROXY     RULE                                                                                           REASON                                   LAST SEEN         COUNT"
        - "sbx-claude-abc1  network   hub.docker.com:443   forward   no applicable policies for op(action=net:connect:tcp, resource=net:domain:hub.docker.com:443)   No matching allow rule (default deny)   19:43:10 27-Aug   1"
        - ""
        - "Allowed requests:"
        - "SANDBOX          TYPE      HOST             PROXY            RULE   REASON   LAST SEEN         COUNT"
        - "sbx-claude-abc1  network   github.com:443   forward-bypass                   19:43:52 27-Aug   4"
        - "sbx-claude-abc1  network   pypi.org:443     forward-bypass                   19:43:47 27-Aug   1"
        - ""
        - "Full org audit trail: https://hub.docker.com/orgs/{{ state.configured_org }}/scout/audit"

  # sbx run --kit <ref> claude — MUST come before the plain `sbx run` scenarios below (first-match-wins)
  - id: sbx-run-with-kit
    when:
      command: [sbx, run]
      args:
        --kit: { any: true }
    completes: kit-running
    then:
      state: { sbx_started: true }
      output:
        - "  Starting sandbox from kit..."
        - { text: "  ✓  microVM booted (dhi.io/ubuntu:22.04-hardened)", delay: short }
        - { text: "  ✓  Tools initialized: claude-code, git, docker, docker-scout, gh", delay: short }
        - { text: "  ✓  Policy profile applied: org-default ({{ state.configured_org }})", delay: short }
        - { text: "  ✓  MCP gateway: claude.ai + docker-hub-mcp allowed", delay: short }
        - { text: "  ✓  Workspace seeded: .claude/CLAUDE.md, .env.template, README.md", delay: short }
        - { text: "  ✓  Credential proxy: active (Docker Hub + GitHub injected)", delay: short }
        - { text: "  ✓  Audit logging: streaming to {{ state.configured_org }}", delay: short }
        - ""
        - "  Sandbox ID: sbx-claude-kit-7f3a"
        - "  Kit:        ai-coding-standard"
        - "  Policy:     org ({{ state.configured_org }})"
      session:
        intro:
          - "  ▐▛███▜▌   Claude Code v2.1.231"
          - " ▝▜█████▛▘  Sonnet 5 · Claude Pro"
          - "            /home/agent/workspace"
          - ""
          - "Claude Code is ready — already set up by the ai-coding-standard kit."
        outro:
          - "Session ended. Kit-provisioned tools, policy, and workspace were all in place before this session even started."

  # Prompt inside the kit-provisioned session — proves the kit's promises (tools,
  # workspace seed, policy) are real, not just described in `sbx kit inspect`.
  - id: agent-kit-check
    when:
      agent: true
      prompt: "What tools do you have available, and what's already in my workspace?"
    completes: kit-verified
    then:
      output:
        - "Tools (pre-installed by the kit, no setup needed):"
        - "  claude-code 1.x   git 2.43   docker 26.1   docker-scout 1.14   gh 2.50   curl, jq"
        - ""
        - "Workspace (pre-seeded by the kit):"
        - "  $ ls /home/agent/workspace"
        - "  .claude/CLAUDE.md   .env.template   README.md"
        - ""
        - "Policy profile: org-default ({{ state.configured_org }}) — network default-deny"
        - "(github.com, docker.io pre-allowed), MCP gateway restricted to claude.ai tools +"
        - "docker-hub-mcp. All of this came from the kit — nobody configured it by hand."

  # sbx run claude — org mode: all Hub-managed policies enforced
  - id: sbx-run-org
    when:
      command: [sbx, run]
      state: { sbx_policy_mode: "org" }
    completes: sbx-running
    then:
      state: { sbx_started: true }
      output:
        - "  Starting sandbox (policy source: org — {{ state.configured_org }})..."
        - { text: "  ✓  microVM booted (Apple Virtualization Framework)", delay: short }
        - { text: "  ✓  Docker daemon initialized inside sandbox", delay: short }
        - { text: "  ✓  Filesystem isolation: host paths restricted to the workspace mount", delay: short }
        - { text: "  ✓  Network policy: default-deny (allow domains explicitly)", delay: short }
        - { text: "  ✓  MCP gateway: connected to {{ state.configured_org }} org allowlist", delay: short }
        - { text: "  ✓  Credential proxy: active (Docker Hub, GitHub injected)", delay: short }
        - { text: "  ✓  Audit logging: streaming to {{ state.configured_org }} org", delay: short }
        - ""
        - "  Sandbox ID: sbx-claude-abc1"
        - "  Working dir: /home/agent/workspace"
        - "  Policy source: org ({{ state.configured_org }})"
      session:
        intro:
          - "  ▐▛███▜▌   Claude Code v2.1.231"
          - " ▝▜█████▛▘  Sonnet 5 · Claude Pro"
          - "            /home/agent/workspace"
          - ""
          - "Claude Code is ready. Ask me anything about this codebase."
        outro:
          - "Session ended. Every action above was already logged to the org's audit stream."

  # sbx run claude — local mode: minimal local policies, no org governance
  - id: sbx-run-local
    when:
      command: [sbx, run]
      state: { sbx_policy_mode: "local" }
    completes: sbx-running
    then:
      state: { sbx_started: true }
      output:
        - "  Starting sandbox (policy source: local)..."
        - { text: "  ✓  microVM booted (Apple Virtualization Framework)", delay: short }
        - { text: "  ✓  Docker daemon initialized inside sandbox", delay: short }
        - { text: "  ~  Filesystem isolation: minimal (only /root excluded from mount)", delay: short }
        - { text: "  ~  Network policy: default-allow (all domains permitted)", delay: short }
        - { text: "  ~  MCP gateway: all servers permitted (no org filter)", delay: short }
        - { text: "  ~  Credential proxy: active (local credentials only)", delay: short }
        - { text: "  ✗  Audit logging: disabled (no org connected)", delay: short }
        - ""
        - "  Sandbox ID: sbx-local-xyz9"
        - "  Working dir: /home/agent/workspace"
        - "  Policy source: local (no org governance)"
      session:
        intro:
          - "  ▐▛███▜▌   Claude Code v2.1.231"
          - " ▝▜█████▛▘  Sonnet 5 · Claude Pro"
          - "            /home/agent/workspace"
          - ""
          - "Claude Code is ready. Ask me anything about this codebase."
        outro:
          - "Session ended. Local mode has no org audit stream — nothing was recorded centrally."

  # ─────────────────────────────────────────
  # AGENT SESSION PROMPTS — Section 4, typed inside the `claude` session above
  # `agent: true` scenarios only match prompts typed in an open session (spec §6.4);
  # they never match plain shell commands, and vice versa.
  # ─────────────────────────────────────────

  # Filesystem policy — literal commands run on the Terminal tab, before
  # any sandbox exists, previewing what it will enforce once started.
  - id: cmd-check-cat-passwd
    when:
      command: [cat]
      args:
        0: "/etc/passwd"
    then:
      output:
        - "cat: /etc/passwd: No such file or directory"

  - id: cmd-check-cat-sshkey
    when:
      command: [cat]
      args:
        0: "~/.ssh/id_rsa"
    then:
      output:
        - "cat: /root/.ssh/id_rsa: No such file or directory"

  - id: cmd-check-ls-workspace
    when:
      command: [ls]
      args:
        0: "/home/agent/workspace"
    then:
      state: { fs_policy_checked: true }
      output:
        - "catalog-service-node/   .claude/   README.md"

  # Network policy — same pattern: literal curl commands, real output.
  - id: cmd-check-curl-blocked
    when:
      command: [curl]
      args:
        0: "https://raw-tracker.example"
    then:
      output:
        - "curl: (7) Failed to connect to raw-tracker.example port 443: Connection refused"

  - id: cmd-check-curl-allowed
    when:
      command: [curl]
      args:
        0: "https://github.com"
    then:
      state: { network_policy_checked: true }
      output:
        - "*  Connected to github.com (140.82.121.3) port 443"
        - "< HTTP/2 200"

  # MCP policy — same pattern: literal claude mcp commands, real output.
  - id: cmd-check-mcp-list
    when:
      command: [claude, mcp, list]
    then:
      output:
        - "claude.ai tools       approved"
        - "docker-hub-mcp        approved"

  - id: cmd-check-mcp-add-blocked
    when:
      command: [claude, mcp, add]
      args:
        0: "internal-scraper"
    completes: sandbox-policies-checked
    then:
      output:
        - "✗  Blocked by the sandbox MCP gateway: 'internal-scraper' is not in"
        - "   {{ state.configured_org }}'s approved MCP server list."
        - "   (MCP access is governed centrally in Docker Home — there's no local"
        - "   policy toggle for it, unlike network and filesystem.)"

  - id: agent-fix-bug
    when:
      agent: true
      prompt: "Find the pricing bug I found in Section 3 and fix it."
    completes: bug-fixed
    then:
      state: { bug_found: true, bug_fixed: true }
      output:
        - "$ grep -rn final_price catalog-service-node/src/"
        - "catalog-service-node/src/services/ProductService.js:29:  product.final_price = product.price * product.discount_rate;"
        - ""
        - "Found it — catalog-service-node/src/services/ProductService.js:29"
        - ""
        - "$ cat catalog-service-node/src/services/ProductService.js"
        - "  // BUG: multiplies price BY the discount rate instead of (1 - rate)"
        - "  product.final_price = product.price * product.discount_rate;"
        - ""
        - "Applying the fix..."
        - ""
        - "$ git diff"
        - "diff --git a/catalog-service-node/src/services/ProductService.js b/catalog-service-node/src/services/ProductService.js"
        - "index 4f9a2c1..8e3d7b2 100644"
        - "--- a/catalog-service-node/src/services/ProductService.js"
        - "+++ b/catalog-service-node/src/services/ProductService.js"
        - "@@ -26,7 +26,7 @@ async function getProductById(id) {"
        - "   const inventory = await getInventoryForProduct(product.upc);"
        - " "
        - "-  product.final_price = product.price * product.discount_rate;"
        - "+  product.final_price = product.price * (1 - product.discount_rate);"
        - " "
        - "   return {"
        - "     inventory,"
        - "     ...product,"
        - "   };"
        - " }"
        - ""
        - "Fixed — one-character change (* discount_rate → * (1 - discount_rate))."
        - "This read, the edit, and the diff are all captured in the org's audit log."

  - id: agent-dhi-rebuild
    when:
      agent: true
      prompt: "Also switch the Dockerfile to the DHI hardened base image and rebuild the image."
    completes: image-patched
    then:
      state: { image_patched: true }
      output:
        - "$ git diff Dockerfile.dhi"
        - "- FROM node:22-slim"
        - "+ FROM dhi.io/node:24-debian13"
        - ""
        - "$ docker build -t catalog-service-node:dhi -f catalog-service-node/Dockerfile.dhi ./catalog-service-node"
        - "[+] Building 38.1s (12/12) FINISHED                    docker:default"
        - { text: " => [internal] load metadata for dhi.io/node:24-debian13          1.8s", delay: short }
        - { text: " => [build 1/4] FROM dhi.io/node:24-debian13@sha256:7f2c...      3.2s", delay: short }
        - { text: " => [build 4/4] RUN npm ci --only=production                      16.9s", delay: build }
        - { text: " => exporting to image                                              1.4s", delay: short }
        - " => => naming to docker.io/library/catalog-service-node:dhi"
        - ""
        - "    ✓  Base image: dhi.io/node:24-debian13 (FIPS + STIG)"
        - "    ✓  Image size: 142MB (vs 198MB with node:22-slim)"

  - id: agent-verify-policy
    when:
      agent: true
      prompt: "Run the Docker Scout policy check on the new image to confirm it passes."
    completes: scout-policy-verified
    then:
      output:
        - "$ docker scout policy catalog-service-node:dhi"
        - "    Policy status  PASS  ──────────────────────────────────────────────────"
        - "                   ✓  No critical or high-profile CVEs     satisfied"
        - "                   ✓  Supply chain attestations            satisfied"
        - "                   ✓  No fixable vulnerabilities           satisfied"
        - "                   ✓  Approved base images                 satisfied"
        - "                   ✓  Default non-root user                satisfied"
        - "    ─────────────────────────────────────────────────────────────────────"
        - "    Result: 5 / 5 policies satisfied  🎉"

  - id: agent-commit-push
    when:
      agent: true
      prompt: "Commit these changes and push them so CI can verify."
    completes: ci-green
    then:
      output:
        - "$ git add catalog-service-node/"
        - "$ git commit -m \"Fix discount calculation and upgrade to dhi.io/node:24-debian13\""
        - "[fix/discount-calculation 9a3c7f2] Fix discount calculation and upgrade to dhi.io/node:24-debian13"
        - " 2 files changed, 3 insertions(+), 3 deletions(-)"
        - " rename Dockerfile => Dockerfile.old (100%)"
        - " rename Dockerfile.dhi => Dockerfile (95%)"
        - ""
        - "$ git push"
        - { text: "Enumerating objects: 7, done.", delay: short }
        - { text: "Writing objects: 100% (4/4), 1.23 KiB | 1.23 MiB/s, done.", delay: clone }
        - "To https://github.com/dockersamples/catalog-service-node.git"
        - "   abc1234..9a3c7f2  fix/discount-calculation → fix/discount-calculation"
        - ""
        - "  ✓  CI triggered: https://github.com/dockersamples/catalog-service-node/actions"
        - "  ✓  Docker Scout CVE scan: PASS (0 critical, 0 high)"
        - "  ✓  Docker Scout policy gate: PASS (5/5 policies)"
        - "  ✓  Image pushed to registry: dockersamples/catalog-service-node:9a3c7f2"
      ci:
        workflow: catalog-service-node-ci
        commit: "Fix discount calculation and upgrade to dhi.io/node:24-debian13"

  - id: sbx-ls
    when:
      command: [sbx, ls]
    then:
      output:
        - "  SANDBOX ID       STATUS    IMAGE                  STARTED     AGENT"
        - "  ───────────────────────────────────────────────────────────────────────────"
        - "  sbx-claude-abc1  running   claude/sandbox:latest  2 min ago   claude-code"

  # ─────────────────────────────────────────
  # SBX KITS — section 5
  # All [sbx, kit, *] scenarios BEFORE the [sbx] catch-all (first-match-wins)
  # ─────────────────────────────────────────

  - id: sbx-kit-inspect
    when:
      command: [sbx, kit, inspect]
      args:
        0: "ai-coding-standard"
    completes: kit-inspected
    then:
      output:
        - "  Kit: ai-coding-standard  v1.3.0"
        - "  Publisher: Docker Inc."
        - "  Scout attestations: ✓ SBOM  ✓ Provenance  ✓ VEX"
        - ""
        - "  BASE IMAGE"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  dhi.io/ubuntu:22.04-hardened  │ 0 critical CVEs │ FIPS 140-2 │ STIG"
        - ""
        - "  PRE-INSTALLED TOOLS"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  claude-code   1.x     AI coding agent"
        - "  git           2.43    Version control"
        - "  docker        26.1    Container runtime (sandbox-internal daemon)"
        - "  docker-scout  1.14    CVE + policy scanner"
        - "  gh            2.50    GitHub CLI"
        - "  curl, jq      latest  HTTP + JSON utilities"
        - ""
        - "  POLICY PROFILE  (org-default)"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  network     default-deny  (github.com, docker.io pre-allowed)"
        - "  filesystem  host mounts restricted to the workspace path"
        - "  mcp         claude.ai tools + docker-hub-mcp pre-approved"
        - "  audit       streaming to org"
        - ""
        - "  WORKSPACE SEED"
        - "  ─────────────────────────────────────────────────────────────────────"
        - "  .claude/CLAUDE.md     Lab-specific agent instructions"
        - "  .env.template         Common env var scaffold"
        - "  README.md             Quick-start guide"
        - ""
        - "  Size: 512 MB compressed | 1.1 GB expanded"
        - "  Pull: sbx kit pull ai-coding-standard"
        - "  Run:  sbx run --kit ai-coding-standard claude"

  - id: sbx-kit-inspect-any
    when:
      command: [sbx, kit, inspect]
      args:
        0: { any: true }
    then:
      output:
        - "  Kit: {{ args.0 }}"
        - "  Run 'sbx kit inspect ai-coding-standard' for a detailed example."

  - id: sbx-kit-pull
    when:
      command: [sbx, kit, pull]
      args:
        0: { any: true }
    completes: kit-pulled
    then:
      output:
        - "  Pulling kit '{{ args.0 }}'..."
        - { text: "  [===========>            ]  45%   230 MB / 512 MB", delay: pull }
        - { text: "  [====================    ]  82%   420 MB / 512 MB", delay: pull }
        - { text: "  [========================] 100%   512 MB / 512 MB  ✓", delay: build }
        - ""
        - "  ✓  Kit '{{ args.0 }}' pulled and verified"
        - "  ✓  Base image attestations: SBOM ✓  Provenance ✓  VEX ✓"
        - "  ✓  Cosign signature verified (Docker Inc.)"
        - "  ✓  Policy profile loaded: org-default"
        - ""
        - "  Start a sandbox with this kit: sbx run --kit {{ args.0 }} claude"

  # ls / cat on the local kit directory being authored in Step 4 — cat falls
  # through to the built-in virtual-FS reader (files declared in labspace.yaml);
  # only the directory listings need explicit scenarios.
  - id: ls-ai-coding-standard
    when:
      command: [ls]
      args:
        0: "./ai-coding-standard/"
    then:
      output:
        - "spec.yaml  files/"

  - id: ls-ai-coding-standard-files
    when:
      command: [ls]
      args:
        0: "./ai-coding-standard/files/"
    then:
      output:
        - ".claude/  .env.template  README.md"

  # sbx kit pack — packages a local kit directory (spec.yaml + files/) into an artifact
  - id: sbx-kit-pack
    when:
      command: [sbx, kit, pack]
      args:
        0: { any: true }
    completes: kit-packed
    then:
      output:
        - "  Validating kit directory '{{ args.0 }}'..."
        - { text: "  ✓  spec.yaml is valid", delay: short }
        - { text: "  ✓  files/ workspace seed found (3 files)", delay: short }
        - { text: "  ✓  Packing kit artifact...", delay: short }
        - ""
        - "  Kit packed: ai-coding-standard.zip"
        - "  Size: 487 MB compressed"
        - ""
        - "  Push it to your org: sbx kit push {{ args.0 }} {{ state.configured_org }}/ai-coding-standard:v1 --sign"

  # sbx kit push DIRECTORY REFERENCE [--sign] — real syntax takes both a source directory and a reference
  - id: sbx-kit-push
    when:
      command: [sbx, kit, push]
      args:
        0: { any: true }
        1: { any: true }
    completes: kit-pushed
    then:
      output:
        - "  Packing and pushing kit from '{{ args.0 }}' to '{{ args.1 }}'..."
        - { text: "  ✓  Signing kit (keyless — Fulcio/Rekor)", delay: short }
        - { text: "  [===========>            ]  45%   219 MB / 487 MB", delay: pull }
        - { text: "  [========================] 100%   487 MB / 487 MB  ✓", delay: pull }
        - ""
        - "  ✓  Kit pushed to Docker Hub org registry: {{ args.1 }}"
        - "  ✓  Available to all members of '{{ state.configured_org }}'"
        - "  ✓  SLSA provenance attestation attached"
        - "  ✓  Visible at: hub.docker.com/orgs/{{ state.configured_org }}/sandboxes/kits"
        - ""

  # sbx kit add SANDBOX REFERENCE — attach a kit to an already-running sandbox
  - id: sbx-kit-add
    when:
      command: [sbx, kit, add]
      args:
        0: { any: true }
        1: { any: true }
    then:
      output:
        - "  Adding kit '{{ args.1 }}' to sandbox '{{ args.0 }}'..."
        - { text: "  ✓  Sandbox container recreated with kit appended", delay: short }
        - { text: "  ✓  Kit-owned volumes preserved (agent session state intact)", delay: short }
        - ""
        - "  ✓  Kit '{{ args.1 }}' is now active in '{{ args.0 }}'"
        - "  Team members can now run: sbx kit pull {{ args.0 }}"

  # sbx bare — catch-all; MUST be last among all sbx scenarios
  # command: [sbx] matches any `sbx ...` command; specific ones above take priority
  - id: sbx-help
    when:
      command: [sbx]
    then:
      output:
        - "Docker Sandbox CLI"
        - ""
        - "Usage:"
        - "  sbx [command]"
        - ""
        - "Available Commands:"
        - "  run         Run an agent in a sandbox (creates it if needed)"
        - "  stop        Stop a running sandbox"
        - "  ls          List running sandboxes"
        - "  kit         Manage kit artifacts (inspect, pull, push, pack, add)"
        - "  policy      Manage sandbox access policies (allow, deny, ls, log)"
        - "  ports       Publish or list ports"
        - "  secret      Manage sandbox secrets"
        - "  login       Sign in to Docker"
        - "  version     Show version"
        - ""
        - "Use 'sbx [command] --help' for more information."

  # git push — BEFORE fix; triggers CI failure (specific state condition takes priority)
  - id: git-push-fail
    when:
      command: [git, push]
      state: { image_patched: false }
    then:
      output:
        - "Enumerating objects: 5, done."
        - "Counting objects: 100% (5/5), done."
        - { text: "Writing objects: 100% (3/3), 892 bytes | 892.00 KiB/s, done.", delay: clone }
        - ""
        - "remote: Resolving deltas: 100% (1/1), done."
        - "To https://github.com/dockersamples/catalog-service-node.git"
        - "   abc1234..d3f9a12  main → main"
        - ""
        - "  ✗  CI triggered — pipeline failed at 'Docker Scout — CVE scan'"
        - "  ✗  3 critical, 11 high CVEs in node:22-slim — image blocked from registry"
        - "  View run: https://github.com/dockersamples/catalog-service-node/actions/runs/..."
      ci:
        workflow: catalog-service-node-ci
        commit: "Initial push (node:22-slim, pre-fix)"
        conclusion: failure
        failedStep: scout-cves
        error: "3 critical, 11 high CVEs detected — merge blocked."
