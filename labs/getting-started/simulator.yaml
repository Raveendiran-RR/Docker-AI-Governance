        - "Run 'sbx --help' to get started."
        - "Docs: https://docs.docker.com/ai/sandboxes/"

  # sbx subcommands — ALL specific ones BEFORE the bare `sbx` catch-all

  # sbx login — BEFORE the catch-all (first-match-wins; [sbx, login] is more specific than [sbx])
