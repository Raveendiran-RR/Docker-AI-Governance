files:
  README.txt: |
    ============================================================
     DHI & AI Governance Lab
    ============================================================

    Sections:
      1. Introduction to DHI and AI Governance
      2. Org Setup — Docker login + Scout policies
      3. DHI Product Catalog — CVEs, SBOM, VEX, attestations
      4. Sandboxes & AI Governance — policies, bug fix, CI fix

    Follow the steps on the left panel.
    Every command in the terminal is fully simulated.
    ============================================================

  catalog-service-node/Dockerfile: |
    ###########################################################
    # Stage: base
    #
    # This stage serves as the base for all of the other stages.
    # By using this stage, it provides a consistent base for both
    # the dev and prod versions of the image.
    ###########################################################
    FROM node:22-slim AS base

    # Setup a non-root user to run the app
    WORKDIR /usr/local/app
    RUN useradd -m appuser && chown -R appuser /usr/local/app
    USER appuser
    COPY --chown=appuser:appuser package.json package-lock.json ./


    ###########################################################
    # Stage: dev
    ###########################################################
    FROM base AS dev
    ENV NODE_ENV=development
    RUN npm install
    CMD ["yarn", "dev-container"]


    ###########################################################
    # Stage: final
    ###########################################################
    FROM base AS final
    ENV NODE_ENV=production
    RUN npm ci --production --ignore-scripts && npm cache clean --force
    COPY ./src ./src

    EXPOSE 3000

    CMD [ "node", "src/index.js" ]

  catalog-service-node/Dockerfile.dhi: |
    ###########################################################
    # Stage: base — DHI hardened image: 0 critical CVEs, FIPS-validated, STIG-hardened
    ###########################################################
    FROM dhi.io/node:24-debian13 AS base

    WORKDIR /usr/local/app
    RUN useradd -m appuser && chown -R appuser /usr/local/app
    USER appuser
    COPY --chown=appuser:appuser package.json package-lock.json ./


    ###########################################################
    # Stage: dev
    ###########################################################
    FROM base AS dev
    ENV NODE_ENV=development
    RUN npm install
    CMD ["yarn", "dev-container"]


    ###########################################################
    # Stage: final
    ###########################################################
    FROM base AS final
    ENV NODE_ENV=production
    RUN npm ci --production --ignore-scripts && npm cache clean --force
    COPY ./src ./src

    EXPOSE 3000

    CMD [ "node", "src/index.js" ]

