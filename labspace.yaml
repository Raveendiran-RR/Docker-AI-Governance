title: "DHI & AI Governance: Secure Supply Chain to Sandbox"
description: "End-to-end demo of Docker Hub Integration hardened images, Docker Scout policy enforcement, CI/CD security gates, and AI agent governance with Docker Sandboxes."

catalog:
  icon: security
  tags: ["dhi", "governance", "docker-scout", "sandboxes", "ai", "supply-chain", "sbom"]

simulator: simulator.yaml

terminals:
  - id: host
    title: Host
    icon: dns
  - id: sandbox
    title: Sandbox
    icon: smart_toy

features:
  ci:
    title: CI Pipeline
    icon: rocket_launch

files:
  README.txt: |
    ============================================================
     DHI & AI Governance Lab
    ============================================================

    Sections:
      1. Introduction to DHI and AI Governance
      2. Org Setup — Docker login + Scout policies
      3. DHI Product Catalog — CVEs, SBOM, VEX, attestations
      4. Sandboxes & AI Governance — policies, bug fix, CI fix

    Follow the steps on the left panel.
    Every command in the terminal is fully simulated.
    ============================================================

  product-catalog/Dockerfile: |
    # syntax=docker/dockerfile:1

    # Build stage — note: uses community node image (CVEs present)
    FROM node:18-alpine AS build
    WORKDIR /app
    COPY package*.json ./
    RUN npm ci --only=production
    COPY src/ ./src/

    FROM node:18-alpine
    WORKDIR /app
    COPY --from=build /app ./
    EXPOSE 8080
    CMD ["node", "src/index.js"]

  product-catalog/Dockerfile.dhi: |
    # syntax=docker/dockerfile:1

    # Build stage — DHI hardened image: 0 critical CVEs, FIPS-validated, STIG-hardened
    FROM dhi.io/node:24-alpine AS build
    WORKDIR /app
    COPY package*.json ./
    RUN npm ci --only=production
    COPY src/ ./src/

    FROM dhi.io/node:24-alpine
    WORKDIR /app
    COPY --from=build /app ./
    EXPOSE 8080
    CMD ["node", "src/index.js"]

  product-catalog/src/routes/products.js: |
    const express = require('express');
    const router = express.Router();
    const db = require('../db');

    // GET /api/products — list all products
    router.get('/', async (req, res) => {
      const products = await db.query(`
        SELECT id, name, price, discount_rate, image_url, category
        FROM products ORDER BY id
      `);
      res.json(products.rows);
    });

    // GET /api/products/:id — single product detail
    router.get('/:id', async (req, res) => {
      const { id } = req.params;
      const result = await db.query(
        'SELECT * FROM products WHERE id = $1', [id]
      );
      const product = result.rows[0];
      if (!product) return res.status(404).json({ error: 'Not found' });

      // BUG: multiplies price BY the discount rate instead of (1 - rate)
      // e.g. $100 at 20% off → should be $80, but shows $20
      product.final_price = product.price * product.discount_rate;

      res.json(product);
    });

    module.exports = router;

  product-catalog/.github/workflows/ci.yml: |
    name: Product Catalog CI

    on:
      push:
        branches: [main, "fix/**"]
      pull_request:

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Build image
            run: docker build -t product-catalog:${{ github.sha }} .

          - name: Docker Scout — CVE scan
            uses: docker/scout-action@v1
            with:
              command: cves
              image: product-catalog:${{ github.sha }}
              only-severities: critical,high
              exit-code: true          # fails CI if critical/high found

          - name: Docker Scout — policy gate
            uses: docker/scout-action@v1
            with:
              command: policy
              image: product-catalog:${{ github.sha }}
              exit-code: true          # fails CI if any policy not satisfied

          - name: Push to registry
            if: github.ref == 'refs/heads/main'
            run: docker push product-catalog:${{ github.sha }}

  product-catalog/vex.json: |
    {
      "bomFormat": "CycloneDX",
      "specVersion": "1.4",
      "version": 1,
      "vulnerabilities": [
        {
          "id": "CVE-2023-44487",
          "analysis": {
            "state": "not_affected",
            "justification": "protected_by_mitigating_control",
            "detail": "HTTP/2 not enabled in this service; only HTTP/1.1 used internally."
          }
        }
      ]
    }

sections:
  - title: "1. Introduction"
    contentPath: 00-intro.md

  - title: "2. Org Setup & Scout Policies"
    contentPath: 01-org-setup.md

  - title: "3. DHI — Product Catalog"
    contentPath: 02-product-catalog.md

  - title: "4. Sandboxes and AI Governance"
    contentPath: 03-sandboxes.md

  - title: "5. SBX Kits"
    contentPath: 04-sbx-kits.md

variables:
  org: dockerdemo
  dhi_node_image: "$$org$$/dhi-node:24-alpine"
  catalog_image: "product-catalog:latest"
  catalog_fixed_image: "product-catalog:dhi"
  scout_org: "dockerdemo"
