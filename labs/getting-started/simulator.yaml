version: '2.0'
metadata:
  id: docker-ai-governance-demo
  title: Docker AI Governance Demo
  summary: 'From a community-based Node.js catalog service to a hardened, attested, policy-gated artifact — then the same governance extended to the AI agent that fixes and ships it, via Docker Sandboxes
    and the DHI MCP server.

    '
state:
  org: org
  scout:
    orgSet: false
  dhi:
    imageBuilt: false
  ci:
    policyPassed: false
  sandbox:
    started: false
    mcpAdded: false
  orgCtx:
    active: false
  demo:
    reset: false
settings:
  pace:
    pull: 1800
    build: 2800
    scan: 2200
    short: 600
controls:
- id: reset-all
  label: Reset demo — clear all state
  description: Toggle ON to reset every state flag to its initial value. Restores the community Dockerfile, clears MCP registration, sandbox, org context, and CI state. Toggle back OFF after reset.
  state: demo.reset
  enabled: false
  disabled: true
- id: org-governance
  label: Org AI Governance — enforced
  description: Master switch. On = org policies active (org context). Off = local only, no DHI image requirement, no MCP pre-registration.
  state: orgCtx.active
  enabled: true
  disabled: false
- id: dhi-image
  label: DHI base image — applied
  description: Simulate the Dockerfile already switched to the hardened image. On = cat Dockerfile shows DHI base, git push triggers CI pass. Off = community image, CI fails.
  state: dhi.imageBuilt
  enabled: true
  disabled: false
- id: mcp-registered
  label: DHI MCP server — registered
  description: Pre-register the DHI MCP server in the sandbox. On = Claude can query the DHI catalog immediately. Off = MCP not yet added.
  state: sandbox.mcpAdded
  enabled: true
  disabled: false
- id: sandbox-started
  label: Sandbox — running
  description: Mark the sandbox as already started. On = sbx ps shows a running sandbox. Off = no sandbox running.
  state: sandbox.started
  enabled: true
  disabled: false
defaults:
  unmatched:
    stderr:
    - command not found — this command isn't part of the demo.
    exit: 1
workflows:
- id: ci-fail
  name: CI
  conclusion: failure
  jobs:
  - id: build
    name: Build
    conclusion: success
    steps:
    - name: actions/checkout@v4
      conclusion: success
    - name: docker build -t catalog-service .
      conclusion: success
  - id: policy-gate
    name: Scout Policy Gate
    conclusion: failure
    needs:
    - build
    steps:
    - name: docker/scout-action@v1
      conclusion: failure
      output: '✗ no-critical-cves     FAILED  2 fixable CRITICALs (braces, axios)

        ✗ require-sbom         FAILED  no SBOM attestation

        ✗ require-provenance   FAILED  no provenance attestation

        ✗ image-signed         FAILED  no cosign signature

        Policy status: FAILED (0 of 4 policies met)

        '
  - id: push
    name: Push
    conclusion: skipped
    needs:
    - policy-gate
    steps:
    - name: docker push [org]/catalog-service:latest
      conclusion: skipped
  - id: deploy
    name: Deploy
    conclusion: skipped
    needs:
    - push
    steps:
    - name: deploy.sh
      conclusion: skipped
- id: ci-pass
  name: CI
  conclusion: success
  jobs:
  - id: build
    name: Build
    conclusion: success
    steps:
    - name: actions/checkout@v4
      conclusion: success
    - name: docker build -t catalog-service . (sbom + provenance attached)
      conclusion: success
  - id: policy-gate
    name: Scout Policy Gate
    conclusion: success
    needs:
    - build
    steps:
    - name: docker/scout-action@v1
      conclusion: success
      output: '✔ no-critical-cves     PASSED

        ✔ require-sbom         PASSED  sbom attestation present

        ✔ require-provenance   PASSED  slsa-provenance mode=max

        ✔ image-signed         PASSED  cosign signature verified

        Policy status: PASSED (4 of 4 policies met)

        '
  - id: push
    name: Push
    conclusion: success
    needs:
    - policy-gate
    steps:
    - name: docker push catalog-service:a9d0e42
      conclusion: success
      output: attestations bound to digest sha256:9e2b71c4a0f8
  - id: deploy
    name: Deploy
    conclusion: success
    needs:
    - push
    steps:
    - name: deploy.sh
      conclusion: success
      output: catalog-service:a9d0e42 live in production
scenarios:
- id: demo-reset
  when:
    command:
    - demo
    - reset
  then:
    state:
      scout.orgSet: false
      dhi.imageBuilt: false
      ci.policyPassed: false
      sandbox.started: false
      sandbox.mcpAdded: false
      orgCtx.active: false
      org: myorg
    files:
    - create: Dockerfile
      content: 'FROM node:22-alpine


        WORKDIR /app


        COPY package*.json ./

        RUN npm ci --omit=dev


        COPY src/ ./src/


        EXPOSE 3000

        CMD ["node", "src/index.js"]

        '
    output:
    - ''
    - "\e[32m✔  Demo reset to initial state.\e[0m"
    - ''
    - "  \e[2mState cleared:\e[0m"
    - '    scout.orgSet        → false'
    - '    dhi.imageBuilt      → false'
    - '    ci.policyPassed     → false'
    - '    sandbox.started     → false'
    - '    sandbox.mcpAdded    → false'
    - '    orgCtx.active       → false'
    - ''
    - "  \e[2mFiles restored:\e[0m"
    - '    Dockerfile          → FROM node:22-alpine (community image)'
    - ''
    - '  Navigate back to Section 01 to start again.'
    - ''
- id: set-org-variable
  when:
    variableDefinition: org
  then:
    state:
      org: '{{ variables.org }}'
    output: []
- id: settings-reset
  when:
    state:
      demo.reset: true
  then:
    state:
      demo.reset: false
      scout.orgSet: false
      dhi.imageBuilt: false
      ci.policyPassed: false
      sandbox.started: false
      sandbox.mcpAdded: false
      orgCtx.active: false
    files:
    - create: Dockerfile
      content: 'FROM node:22-alpine


        WORKDIR /app


        COPY package*.json ./

        RUN npm ci --omit=dev


        COPY src/ ./src/


        EXPOSE 3000

        CMD ["node", "src/index.js"]

        '
    output:
    - ''
    - "\e[32m✔  All state reset to initial values.\e[0m"
    - ''
    - '  scout.orgSet        → false'
    - '  dhi.imageBuilt      → false'
    - '  ci.policyPassed     → false'
    - '  sandbox.started     → false'
    - '  sandbox.mcpAdded    → false'
    - '  orgCtx.active       → false'
    - ''
    - '  Dockerfile restored → FROM node:22-alpine'
    - ''
    - '  Navigate to Section 01 to start from the beginning.'
    - ''
- id: docker-version
  when:
    command:
    - docker
    - version
  then:
    output:
    - 'Client:'
    - ' Version:    29.6.2'
    - 'Server:'
    - ' Version:    29.6.2'
- id: docker-context-use
  when:
    command:
    - docker
    - context
    - use
    args:
      0:
        any: true
  then:
    state:
      scout.orgSet: true
    output:
    - ✔  Context "{{ args.0 }}" selected.
    - '   All subsequent commands will run under this organization context.'
- id: docker-login-username
  when:
    command:
    - docker
    - login
    args:
      --username:
        any: true
  then:
    output:
    - 'Password:'
    - Login Succeeded
    - ''
    - Logging in with your password grants your terminal complete access
    - to your account. For better security, use a personal access token.
    state:
      org: '{{ args.username }}'
- id: docker-login-org
  when:
    command:
    - docker
    - login
    args:
      --org:
        any: true
  then:
    state:
      org.contextSet: true
      org: '{{ args.org }}'
    output:
    - '✔  Switched to org context: {{ args.org }}'
    - '   Org policies and DHI image namespace are now active.'
    - '   Sandbox agents started in this context inherit the org policy set.'
- id: docker-login-bare
  when:
    command:
    - docker
    - login
  then:
    output:
    - Authenticating with existing credentials...
    - Login Succeeded
- id: docker-scout-config-org
  when:
    command:
    - docker
    - scout
    - config
    args:
      0:
        oneOf:
        - organization
      1:
        any: true
  then:
    state:
      scout.orgSet: true
      org: '{{ args.1 }}'
    output:
    - '    ✓ organization set to {{ args.1 }}'
- id: docker-scout-config-org-positional
  when:
    command:
    - docker
    - scout
    - config
    - organization
    args:
      0:
        any: true
  then:
    state:
      scout.orgSet: true
      org: '{{ args.0 }}'
    output:
    - '    ✓ organization set to {{ args.0 }}'
- id: docker-scout-policy-list
  when:
    command:
    - docker
    - scout
    - policy
    args:
      --org:
        any: true
  then:
    output:
    - '    ✓ Fetching policy set for {{ args.org }}'
    - ''
    - '  Policy Set: Supply Chain Security'
    - '  ──────────────────────────────────────────────────────────────'
    - '  NAME                              STATUS       APPLIES TO'
    - '  No fixable critical CVEs          evaluating   All images'
    - '  No known exploited CVEs (KEV)     evaluating   All images'
    - '  SBOM attestation present          evaluating   All images'
    - '  Provenance attestation present    evaluating   All images'
    - '  Image signed (cosign)             evaluating   Production images'
    - '  Default non-root user             evaluating   All images'
    - '  ──────────────────────────────────────────────────────────────'
    - '  Run ''docker scout cves <image>'' to evaluate a specific image.'
- id: cat-dockerfile-before
  when:
    command:
    - cat
    - Dockerfile
    state:
      dhi.imageBuilt: false
  then:
    output:
    - FROM node:22-alpine
    - ''
    - WORKDIR /app
    - ''
    - COPY package*.json ./
    - RUN npm ci --omit=dev
    - ''
    - COPY src/ ./src/
    - ''
    - EXPOSE 3000
    - CMD ["node", "src/index.js"]
- id: cat-dockerfile-after
  when:
    command:
    - cat
    - Dockerfile
    state:
      dhi.imageBuilt: true
  then:
    output:
    - FROM {{ state.org }}/dhi-node:22
    - ''
    - WORKDIR /app
    - ''
    - COPY package*.json ./
    - RUN npm ci --omit=dev
    - ''
    - COPY src/ ./src/
    - ''
    - EXPOSE 3000
    - CMD ["node", "src/index.js"]
- id: cat-new-dockerfile
  when:
    command:
    - cat
    - newDockerfile
  then:
    output:
    - '# Docker Hardened Image — optimised for production'
    - '# Replaces: FROM node:22-alpine'
    - '#'
    - '# What changes:'
    - '#   - Distroless base: no shell, no package manager at runtime'
    - '#   - 0 CRITICAL / 0 HIGH CVEs  (vs 2 CRITICAL in node:22-alpine)'
    - '#   - FIPS 140-2 validated cryptography'
    - '#   - STIG v1R4 compliant'
    - '#   - SBOM, SLSA provenance, and cosign signature attached at build'
    - '#   - Default non-root user: node (uid=1000)'
    - '#'
    - "FROM \e[32m{{ state.org }}/dhi-node:22\e[0m"
    - ''
    - WORKDIR /app
    - ''
    - COPY package*.json ./
    - RUN npm ci --omit=dev
    - ''
    - COPY src/ ./src/
    - ''
    - EXPOSE 3000
    - CMD ["node", "src/index.js"]
- id: cat-products-route
  when:
    command:
    - cat
    - src/routes/products.js
  then:
    output:
    - const { Router } = require("express");
    - const { pool } = require("../db/pool");
    - const axios = require("axios");
    - ''
    - const upstream = process.env.CATALOG_UPSTREAM || "http://wiremock:8080";
    - const router = Router();
    - ''
    - router.get("/", async (_req, res) => {
    - '  const { rows } = await pool.query("SELECT * FROM products ORDER BY id");'
    - '  res.json(rows);'
    - '});'
    - ''
    - router.get("/:id", async (req, res) => {
    - '  const { rows } = await pool.query("SELECT * FROM products WHERE id = $1", [req.params.id]);'
    - '  if (!rows.length) return res.status(404).json({ error: "not found" });'
    - '  const price = await axios.get(`${upstream}/price/${req.params.id}`).then(r => r.data).catch(() => null);'
    - '  res.json({ ...rows[0], price });'
    - '});'
    - ''
    - module.exports = router;
- id: tree
  when:
    command:
    - tree
  then:
    output:
    - .
    - ├── Dockerfile
    - ├── README.md
    - ├── package.json
    - ├── db
    - │   └── schema.sql
    - ├── src
    - │   ├── index.js
    - │   ├── routes
    - │   │   └── products.js
    - │   ├── db
    - │   │   └── pool.js
    - │   └── events
    - │       └── kafka.js
    - └── frontend
    - '    ├── package.json'
    - '    └── src'
    - '        └── App.jsx'
    - ''
    - 7 directories, 11 files
