name: Validate labs

# Validates every lab on each pull request (and on demand) so a broken lab is
# caught before it merges — not just at deploy time. Uses the prebuilt authoring
# image, so there's nothing to install.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # v7.0.1
      - name: Validate labs
        # Pin the tag to a released version to match your deploy (e.g. ":1").
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/labs:/labs:ro" \
            "${SIMSPACE_AUTHORING_IMAGE:-dockersamples/simspace-authoring:latest}" \
            npm run validate-lab -- /labs
        env:
          SIMSPACE_AUTHORING_IMAGE: dockersamples/simspace-authoring:latest
