version: "2.0"

metadata:
  id: dhi-ai-governance
  title: "DHI & AI Governance: Secure Supply Chain to Sandbox"
  summary: >
    Walk through Docker Hub Integration hardened images, Docker Scout CVE and
    policy enforcement, CI/CD security gates, SBOM/VEX/attestations, and
    Docker Sandboxes for AI agent governance.

state:
  logged_in: false
  org_set: false
  configured_org: "dockerdemo"      # updated when user runs docker scout enroll / config organization
  repo_cloned: false
  image_built: false
  services_up: false
  sbx_policy_mode: "org"            # "org" = Hub-managed policies; "local" = sbx defaults only
  sbx_installed: false
  sbx_started: false
  bug_found: false
  bug_fixed: false
  image_patched: false

settings:
  pace:
    pull: 1400
    build: 900
    clone: 700
    short: 200

defaults:
  unmatched:
    stderr: ["bash: command not found. Try running a command from the lab steps."]
    exit: 127

# ─────────────────────────────────────────
# SETTINGS — learner-facing toggles (shown in the Settings dialog next to Reset)
# ─────────────────────────────────────────
controls:
  - id: sbx-policy-mode
    label: "Sandbox policy source"
    description: >
      Org: Docker Hub-managed policies — network default-deny, filesystem
      restrictions, MCP allowlist, and full audit logging enforced for every
      sandbox in your org. Local: sbx CLI defaults only — no org restrictions,
      no audit stream.
    state: sbx_policy_mode
    enabled: "org"
    disabled: "local"

# ─────────────────────────────────────────
# CI WORKFLOWS — referenced by then.ci in git push scenarios
# ─────────────────────────────────────────
workflows:
  - id: catalog-service-node-ci
    name: "Product Catalog CI"
    on: push
    steps:
      - id: checkout
        name: "actions/checkout@v4"
        logs:
          - "Cloning into workspace..."
          - "HEAD is now at abc1234."

      - id: build
        name: "Build image"
        logs:
          - "$ docker build -t catalog-service-node:${{ github.sha }} ."
          - "[+] Building 42.3s (12/12) FINISHED"
          - "=> naming to docker.io/library/catalog-service-node:abc1234"

      - id: scout-cves
        name: "Docker Scout — CVE scan"
        requires: image_patched
        logs:
          - "$ docker scout cves catalog-service-node:abc1234 --only-severities critical,high --exit-code"
          - "✓  0 critical, 0 high CVEs found"
          - "Exit code: 0"
        failure:
          error: "3 critical, 11 high CVEs detected in node:22-slim — pipeline blocked."
          logs:
            - "$ docker scout cves catalog-service-node:abc1234 --only-severities critical,high --exit-code"
            - "✗  Found 3 critical, 11 high CVEs"
            - "   openssl  CVE-2024-0727  CRITICAL  9.1"
            - "   libssl3  CVE-2023-5363  CRITICAL  9.1"
            - "   busybox  CVE-2023-42363 CRITICAL  9.8"
            - "   ... and 11 high severity CVEs"
            - "Error: Process completed with exit code 1."

      - id: scout-policy
        name: "Docker Scout — policy gate"
        requires: image_patched
        logs:
          - "$ docker scout policy catalog-service-node:abc1234 --exit-code"
          - "Policy status  PASS"
          - "✓  5 / 5 policies satisfied"
          - "Exit code: 0"
        failure:
          error: "1 / 5 Scout policies satisfied — image blocked from registry."
          logs:
            - "$ docker scout policy catalog-service-node:abc1234 --exit-code"
            - "Policy status  FAIL"
            - "✗  1 / 5 policies satisfied"
            - "Error: Process completed with exit code 1."

      - id: push-image
        name: "Push to registry"
        requires: image_patched
        logs:
          - "$ docker push dockersamples/catalog-service-node:abc1234"
          - "The push refers to repository docker.io/dockersamples/catalog-service-node"
          - "abc1234: digest: sha256:9f8e7d6c5b4a... size: 1847"
        failure:
          error: "Push skipped — upstream step failed."
          logs:
            - "Step skipped due to upstream failure."

scenarios:

  # ─────────────────────────────────────────
  # DEMO RESET — works from any terminal, any section
  # ─────────────────────────────────────────

  - id: demo-reset
    when:
      command: [demo, reset]
    then:
      state:
        logged_in: false
        org_set: false
        configured_org: "dockerdemo"
        repo_cloned: false
        image_built: false
        services_up: false
        sbx_policy_mode: "org"
        sbx_installed: false
        sbx_started: false
        bug_found: false
        bug_fixed: false
        image_patched: false
      output:
        - "  ╔══════════════════════════════════════════════════════╗"
        - "  ║            Demo Reset — State Cleared                ║"
        - "  ╚══════════════════════════════════════════════════════╝"
        - ""
        - "  ✓  Docker login          cleared"
        - "  ✓  Scout org             reset → dockerdemo"
        - "  ✓  Repository            cleared"
        - "  ✓  Images                cleared"
        - "  ✓  Sandbox policy mode   org (default)"
        - "  ✓  Sandbox               stopped"
        - "  ✓  Bug fix state         cleared"
        - "  ✓  Image patch state     cleared"
        - ""
        - "  Lab is back at initial state."
        - "  Start from Section 2 — Org Setup & Scout Policies."

  # ─────────────────────────────────────────
  # SECTION 2 — Org Setup
  # ─────────────────────────────────────────

  # Specific (with -u flag) BEFORE the bare catch-all — first-match-wins
  - id: docker-login-with-user
    completes: docker-login
    when:
      command: [docker, login]
      args:
        -u: { any: true }
    then:
      state: { logged_in: true }
      output:
        - "Authenticating with existing credentials..."
        - "Login Succeeded"

  # docker login dhi.io — BEFORE the bare `docker login` catch-all (first-match-wins)
  - id: docker-login-dhi
    when:
      command: [docker, login]
      args:
        0: "dhi.io"
    then:
      state: { logged_in: true }
      output:
        - "Authenticating with existing credentials..."
        - "Login Succeeded"
        - ""
        - "You are now authenticated to pull Docker Hardened Images from dhi.io."

  - id: docker-login
    completes: docker-login
    when:
      command: [docker, login]
    then:
      state: { logged_in: true }
      output:
        - "Authenticating with existing credentials..."
        - { text: "WARNING! Your password will be stored unencrypted in /root/.docker/config.json.", delay: short }
        - { text: "Configure a credential helper to remove this warning. See", delay: short }
        - { text: "https://docs.docker.com/engine/reference/commandline/login/#credentials-store", delay: short }
        - ""
        - "Login Succeeded"

  - id: docker-scout-enroll
    completes: scout-enrolled
    when:
      command: [docker, scout, enroll]
      args:
        0: { any: true }
    then:
      state: { configured_org: "{{ args.0 }}" }
      output:
        - "    ✓  Successfully enrolled organization '{{ args.0 }}' in Docker Scout"
        - "    ✓  Docker Scout is now active for all repositories in this organization"

  - id: docker-scout-config-org
    completes: org-configured
    when:
      command: [docker, scout, config, organization]
      args:
        0: { any: true }
    then:
      state: { org_set: true, configured_org: "{{ args.0 }}" }
      output:
        - "    ✓  Organization set to '{{ args.0 }}'"
        - ""
        - "Docker Scout will now evaluate images against your organization's policies."
        - "Run 'docker scout policy ls' to see active policies."

  # docker scout policy publish — must come BEFORE the generic `docker scout policy` catch-all
  - id: docker-scout-policy-publish
    when:
      command: [docker, scout, policy, publish]
      args:
        --policy-dir: { any: true }
        0: { any: true }
    then:
      output:
        - "    ✓  Loaded 5 policies from ./policies"
        - "         - No critical or high-profile CVEs"
        - "         - Supply chain attestations"
        - "         - No fixable vulnerabilities"
        - "         - Approved base images"
        - "         - Default non-root user"
        - "    ✓  Bundle published to {{ args.0 }}"
        - ""
        - "  Docker Scout will now evaluate images against this bundle for organization '{{ state.configured_org }}'."
        - "  Run 'docker scout policy <image> --org {{ state.configured_org }}' to evaluate an image."

  # ─────────────────────────────────────────
  # SECTION 3 — Product Catalog
  # ─────────────────────────────────────────

  - id: git-clone-catalog-service-node
    when:
      command: [git, clone]
      args:
        0: { any: true }
    then:
      state: { repo_cloned: true }
      output:
        - "Cloning into 'catalog-service-node'..."
        - { text: "remote: Enumerating objects: 187, done.", delay: clone }
        - "remote: Counting objects: 100% (187/187), done."
        - "remote: Compressing objects: 100% (112/112), done."
        - { text: "Receiving objects: 100% (187/187), 48.3 KiB | 1.2 MiB/s, done.", delay: clone }
        - "Resolving deltas: 100% (63/63), done."

  # ls — scalar string equals (spec §6.2); unlisted paths fall through to built-in ls
  - id: ls-catalog-service-node
    when:
      command: [ls]
      args:
        0: "catalog-service-node/"
    then:
      output:
        - "Dockerfile  Dockerfile.dhi  LICENSE  README.md  architecture.png"
        - "compose.yaml  demo/  dev/  package.json  package-lock.json  src/  test/  .github/"

  - id: ls-catalog-service-node-no-slash
    when:
      command: [ls]
      args:
        0: "catalog-service-node"
    then:
      output:
        - "Dockerfile  Dockerfile.dhi  LICENSE  README.md  architecture.png"
        - "compose.yaml  demo/  dev/  package.json  package-lock.json  src/  test/  .github/"

  # ls src/ — shows the app's own source layout (the file with the pricing bug lives here)
  - id: ls-catalog-service-node-src
    when:
      command: [ls]
      args:
        0: "catalog-service-node/src/"
    then:
      output:
        - "index.js  services/"

  - id: ls-catalog-service-node-src-services
    when:
      command: [ls]
      args:
        0: "catalog-service-node/src/services/"
    then:
      output:
        - "InventoryService.js  ProductService.js  PublisherService.js  StorageService.js"

  # cat — specific paths override built-in; unlisted paths fall through to built-in cat (reads virtual FS)
  - id: cat-dockerfile
    when:
      command: [cat]
      args:
        0: "catalog-service-node/Dockerfile"
    then:
      output:
        - "###########################################################"
        - "# Stage: base"
        - "###########################################################"
        - "FROM node:22-slim AS base"
        - ""
        - "# Setup a non-root user to run the app"
        - "WORKDIR /usr/local/app"
        - "RUN useradd -m appuser && chown -R appuser /usr/local/app"
        - "USER appuser"
        - "COPY --chown=appuser:appuser package.json package-lock.json ./"
        - ""
        - "###########################################################"
        - "# Stage: final"
        - "###########################################################"
        - "FROM base AS final"
        - "ENV NODE_ENV=production"
        - "RUN npm ci --production --ignore-scripts && npm cache clean --force"
        - "COPY ./src ./src"
        - ""
        - "EXPOSE 3000"
        - ""
        - "CMD [ \"node\", \"src/index.js\" ]"

  - id: cat-compose-yaml
    when:
      command: [cat]
      args:
        0: "catalog-service-node/compose.yaml"
    then:
      output:
        - "services:"
        - "  demo-client:    # React UI — http://localhost:5173"
        - "    image: node:lts-slim"
        - "    ports: [\"5173:5173\"]"
        - "  postgres:       # product data — http://localhost:5432"
        - "    image: postgres:17.9"
        - "    ports: [\"5432:5432\"]"
        - "  pgadmin:        # DB visualizer — http://localhost:5050"
        - "    image: dpage/pgadmin4:9.14.0"
        - "    ports: [\"5050:80\"]"
        - "  aws:            # LocalStack S3 for product images — http://localhost:4566"
        - "    image: localstack/localstack:4.14.0"
        - "    ports: [\"4566:4566\"]"
        - "  mock-inventory: # WireMock stand-in for the real inventory service"
        - "    image: wiremock/wiremock:3.12.1"
        - "    ports: [\"8090:8080\"]"
        - "  kafka:          # product update events"
        - "    image: apache/kafka:4.0.0"
        - "    ports: [\"9092:9092\"]"
        - "  kafka-ui:       # Kafka visualizer — http://localhost:8080"
        - "    image: kafbat/kafka-ui:v1.2.0"
        - "    ports: [\"8080:8080\"]"
        - ""
        - "# Note: the API itself isn't a compose service — it runs natively via"
        - "# 'npm run dev' against these containers, listening on :3000."

  - id: ci-pipeline-output
    when:
      command: [cat]
      args:
        0: "ci-output.log"
    then:
      output:
        - "Run docker/scout-action@v1"
        - "  with:"
        - "    command: policy"
        - "    image: catalog-service-node:abc1234"
        - "    exit-code: true"
        - ""
        - "    ✓  Image analyzed: catalog-service-node:abc1234"
        - "    ✓  Organization: {{ state.configured_org }}"
        - ""
        - "    Policy status  FAIL  ─────────────────────────────────────────"
        - "                   ✗  No critical or high-profile CVEs   FAIL"
        - "                   ✗  Supply chain attestations           FAIL"
        - "                   ✗  No fixable vulnerabilities          FAIL"
        - "                   ✗  Approved base images                FAIL"
        - "                   ✓  Default non-root user               PASS"
        - ""
        - "    Result: 1 / 5 policies satisfied"
        - ""
        - "Error: Process completed with exit code 1."
        - ""
        - "  ✗ Job 'build' failed at step 'Docker Scout — policy gate'"
        - "  View run at: https://github.com/dockersamples/catalog-service-node/actions/runs/..."

  - id: docker-build-catalog-service-node
    completes: image-built
    when:
      command: [docker, build]
    then:
      state: { image_built: true }
      output:
        - "[+] Building 42.3s (12/12) FINISHED                    docker:default"
        - " => [internal] load build definition from Dockerfile                 0.1s"
        - " => => transferring dockerfile: 312B                                 0.0s"
        - " => [internal] load .dockerignore                                    0.0s"
        - { text: " => [internal] load metadata for docker.io/library/node:22-slim  2.1s", delay: short }
        - " => [build 1/4] FROM docker.io/library/node:22-slim@sha256:a4b...  0.0s"
        - { text: " => [build 2/4] WORKDIR /app                                        0.1s", delay: short }
        - { text: " => [build 3/4] COPY package*.json ./                               0.2s", delay: short }
        - { text: " => [build 4/4] RUN npm ci --only=production                       18.4s", delay: build }
        - { text: " => [stage-2 1/2] COPY --from=build /app ./                        0.3s", delay: short }
        - " => exporting to image                                               1.8s"
        - " => => exporting layers                                              1.7s"
        - " => => writing image sha256:3f8c...                                  0.0s"
        - " => => naming to docker.io/library/catalog-service-node:latest            0.0s"
        - ""
        - " View build details: docker-desktop://dashboard/build/..."
        - ""
        - "What's next:"
        - "    View a summary of image vulnerabilities and recommendations → docker scout quickview catalog-service-node:latest"

  - id: docker-compose-up
    when:
      command: [docker, compose, up]
    then:
      state: { services_up: true }
      output:
        - "[+] Running 7/7"
        - { text: " ✔ Network catalog-service-node_default  Created         0.1s", delay: short }
        - { text: " ✔ Container catalog-service-node-postgres-1        Healthy   2.3s", delay: short }
        - { text: " ✔ Container catalog-service-node-kafka-1           Started   1.8s", delay: short }
        - { text: " ✔ Container catalog-service-node-aws-1             Started   1.4s", delay: short }
        - { text: " ✔ Container catalog-service-node-mock-inventory-1  Started   0.9s", delay: short }
        - { text: " ✔ Container catalog-service-node-pgadmin-1         Started   1.1s", delay: short }
        - { text: " ✔ Container catalog-service-node-kafka-ui-1        Started   2.0s", delay: short }
        - { text: " ✔ Container catalog-service-node-demo-client-1     Started   0.6s", delay: short }
        - ""
        - "catalog-service-node-postgres-1        | database system is ready to accept connections"
        - "catalog-service-node-kafka-1            | Kafka Server started (kraft mode)"
        - "catalog-service-node-aws-1              | Ready. (LocalStack S3 — bucket 'product-images' created)"
        - "catalog-service-node-mock-inventory-1   | WireMock listening on :8080 (mapped to :8090)"
        - "catalog-service-node-demo-client-1      | VITE ready — Local: http://localhost:5173/"
        - ""
        - "  Note: this only starts the app's dependencies. The API itself runs"
        - "  natively — see the next step."

  - id: npm-install
    when:
      command: [npm, install]
    then:
      output:
        - { text: "npm warn deprecated node-fetch@2.7.0: Fetch is now natively supported", delay: short }
        - { text: "added 342 packages in 4s", delay: build }

  - id: npm-run-dev
    when:
      command: [npm, run, dev]
    then:
      output:
        - "> catalog-service-node@1.0.0 dev"
        - "> nodemon --inspect src/index.js --ignore dev"
        - ""
        - "[nodemon] starting `node --inspect src/index.js`"
        - "Server is running on port 3000"

  # curl — specific paths first; scalar string equals (spec §6.2)
  - id: curl-product-item
    when:
      command: [curl]
      args:
        0: "http://localhost:3000/api/products/1"
    then:
      output:
        - "{"
        - "  \"inventory\": { \"error\": false, \"quantity\": 42 },"
        - "  \"id\": 1,"
        - "  \"name\": \"Widget Pro\","
        - "  \"upc\": \"196000112233\","
        - "  \"price\": 99.99,"
        - "  \"description\": \"A professional-grade widget.\","
        - "  \"discount_rate\": 0.2,"
        - "  \"has_image\": true,"
        - "  \"final_price\": 20.00"
        - "}"
        - ""
        - "# NOTE: Something looks wrong!"
        - "# price=$99.99, discount=20% → final_price should be $79.99"
        - "# But final_price shows $20.00 (price * discount_rate instead of price * (1 - discount_rate))"

  - id: curl-product-2
    when:
      command: [curl]
      args:
        0: "http://localhost:3000/api/products/4"
    then:
      output:
        - "{"
        - "  \"inventory\": { \"error\": false, \"quantity\": 7 },"
        - "  \"id\": 4,"
        - "  \"name\": \"Thingamajig Plus\","
        - "  \"upc\": \"196000445566\","
        - "  \"price\": 199.99,"
        - "  \"description\": \"The deluxe thingamajig, now plus.\","
        - "  \"discount_rate\": 0.25,"
        - "  \"has_image\": true,"
        - "  \"final_price\": 50.00"
        - "}"
        - ""
        - "# price=$199.99, discount=25% → should be $149.99, showing $50.00 ← BUG"

  - id: curl-products-list
    when:
      command: [curl]
      args:
        0: "http://localhost:3000/api/products"
    then:
      output:
        - "["
        - "  {\"id\":1,\"name\":\"Widget Pro\",\"upc\":\"196000112233\",\"price\":99.99,\"discount_rate\":0.2,\"has_image\":true},"
        - "  {\"id\":2,\"name\":\"Gadget Ultra\",\"upc\":\"196000223344\",\"price\":149.99,\"discount_rate\":0.15,\"has_image\":true},"
        - "  {\"id\":3,\"name\":\"Doohickey Deluxe\",\"upc\":\"196000334455\",\"price\":49.99,\"discount_rate\":0.0,\"has_image\":false},"
        - "  {\"id\":4,\"name\":\"Thingamajig Plus\",\"upc\":\"196000445566\",\"price\":199.99,\"discount_rate\":0.25,\"has_image\":true},"
        - "  ... (12 products total)"
        - "]"
        - ""
        - "# Note: the list endpoint doesn't compute final_price or fetch inventory —"
        - "# only GET /api/products/:id does. That's where the bug shows up."

  - id: docker-scout-quickview
    when:
      command: [docker, scout, quickview]
      args:
        0: { any: true }
    then:
      output:
        - "    i  New version 1.14.0 available (installed version is 1.11.0) at https://github.com/docker/scout-cli"
        - "        Image │  catalog-service-node:latest"
        - "    Analyzed │  77 packages"
        - "  Base image │  node:22-slim"
        - "  Refreshed │  1 minute ago"
        - ""
        - "    ✗ Critical  3"
        - "    ✗ High     11"
        - "    ~ Medium   29"
        - "    ✓ Low       4"
        - ""
        - "  Packages at risk │  43 / 77"
        - ""
        - "What's next?"
        - "    View base image update recommendations → docker scout recommendations catalog-service-node:latest"
        - "    Include policy results in your quickview → docker scout quickview --org {{ state.configured_org }} catalog-service-node:latest"

  # docker scout cves — specific image args BEFORE the any catch-all (first-match-wins)
  # Image name moved from command array to args (spec §6.1: command is prefix only)
  - id: docker-scout-cves-catalog
    completes: cves-found
    when:
      command: [docker, scout, cves]
      args:
        0: "catalog-service-node:latest"
    then:
      output:
        - "    ✓ SBOM of image already cached, 77 packages indexed"
        - "    ✓ Pulled"
        - "    ✗ Found 3 critical, 11 high, 29 medium, 4 low vulnerabilities"
        - ""
        - "   ╭──────────────────────────────────────────────────────────────────────────────╮"
        - "   │                          Vulnerability summary                               │"
        - "   ├───────────────────┬──────────────────────────────────────────────────────────┤"
        - "   │ Severity          │ 3 CRITICAL │ 11 HIGH │ 29 MEDIUM │ 4 LOW                 │"
        - "   │ Fixable           │ 3 CRITICAL │  9 HIGH │ 21 MEDIUM │ 2 LOW                 │"
        - "   │ Base image        │ node:22-slim                                           │"
        - "   ╰───────────────────┴──────────────────────────────────────────────────────────╯"
        - ""
        - "   CRITICAL Vulnerabilities"
        - "   ─────────────────────────────────────────────────────────────────────────────"
        - "   Package       CVE ID           Severity  Fixed In  CVSS  Description"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   openssl       CVE-2024-0727    CRITICAL  3.2.1     9.1   PKCS12 null ptr dereference"
        - "   libssl3       CVE-2023-5363    CRITICAL  3.1.4     9.1   AES-SIV cipher misuse"
        - "   glibc         CVE-2023-4911    CRITICAL  2.37-r2   9.8   Looney Tunables buffer overflow"
        - ""
        - "   HIGH Vulnerabilities"
        - "   ─────────────────────────────────────────────────────────────────────────────"
        - "   Package       CVE ID           Severity  Fixed In  CVSS  Description"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   curl          CVE-2023-38545   HIGH      8.3.0     8.1   Heap overflow in SOCKS5"
        - "   libcurl       CVE-2023-38546   HIGH      8.3.0     4.2   Cookie injection in SOCKS5"
        - "   nghttp2       CVE-2023-44487   HIGH      1.57.0    7.5   HTTP/2 Rapid Reset"
        - "   npm           CVE-2024-21538   HIGH      10.8.3    7.4   cross-spawn ReDoS"
        - "   node          CVE-2024-22019   HIGH      20.11.1   7.5   HTTP request smuggling"
        - "   coreutils     CVE-2024-0684    HIGH      9.4-r1    7.5   Integer overflow in split"
        - "   perl-base     CVE-2023-47038   HIGH      5.36.0    7.8   Buffer overflow in Perl_my_setenv"
        - "   zlib          CVE-2023-45853   HIGH      1.3.1     9.8   MiniZip integer overflow"
        - "   libexpat      CVE-2023-52425   HIGH      2.6.2     7.5   Billion laughs attack"
        - "   libxml2       CVE-2024-25062   HIGH      2.12.5    7.5   Use-after-free in reader"
