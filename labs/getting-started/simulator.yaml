version: "2.0"

metadata:
  id: dhi-ai-governance
  title: "DHI & AI Governance: Secure Supply Chain to Sandbox"
  summary: >
    Walk through Docker Hub Integration hardened images, Docker Scout CVE and
    policy enforcement, CI/CD security gates, SBOM/VEX/attestations, and
    Docker Sandboxes for AI agent governance.

state:
  logged_in: false
  org_set: false
  configured_org: "dockerdemo"      # updated when user runs docker scout enroll / config organization
  repo_cloned: false
  image_built: false
  services_up: false
  sbx_policy_mode: "org"            # "org" = Hub-managed policies; "local" = sbx defaults only
  sbx_installed: false
  sbx_started: false
  bug_found: false
  bug_fixed: false
  image_patched: false

settings:
  pace:
    pull: 1400
    build: 900
    clone: 700
    short: 200

defaults:
  unmatched:
    stderr: ["bash: command not found. Try running a command from the lab steps."]
    exit: 127

# ─────────────────────────────────────────
# SETTINGS — learner-facing toggles (shown in the Settings dialog next to Reset)
# ─────────────────────────────────────────
controls:
  - id: sbx-policy-mode
    label: "Sandbox policy source"
    description: >
      Org: Docker Hub-managed policies — network default-deny, filesystem
      restrictions, MCP allowlist, and full audit logging enforced for every
      sandbox in your org. Local: sbx CLI defaults only — no org restrictions,
      no audit stream.
    state: sbx_policy_mode
    enabled: "org"
    disabled: "local"

# ─────────────────────────────────────────
# CI WORKFLOWS — referenced by then.ci in git push scenarios
# ─────────────────────────────────────────
workflows:
  - id: product-catalog-ci
    name: "Product Catalog CI"
    on: push
    steps:
      - id: checkout
        name: "actions/checkout@v4"
        logs:
          - "Cloning into workspace..."
          - "HEAD is now at abc1234."

      - id: build
        name: "Build image"
        logs:
          - "$ docker build -t product-catalog:${{ github.sha }} ."
          - "[+] Building 42.3s (12/12) FINISHED"
          - "=> naming to docker.io/library/product-catalog:abc1234"

      - id: scout-cves
        name: "Docker Scout — CVE scan"
        requires: image_patched
        logs:
          - "$ docker scout cves product-catalog:abc1234 --only-severities critical,high --exit-code"
          - "✓  0 critical, 0 high CVEs found"
          - "Exit code: 0"
        failure:
          error: "3 critical, 11 high CVEs detected in node:18-alpine — pipeline blocked."
          logs:
            - "$ docker scout cves product-catalog:abc1234 --only-severities critical,high --exit-code"
            - "✗  Found 3 critical, 11 high CVEs"
            - "   openssl  CVE-2024-0727  CRITICAL  9.1"
            - "   libssl3  CVE-2023-5363  CRITICAL  9.1"
            - "   busybox  CVE-2023-42363 CRITICAL  9.8"
            - "   ... and 11 high severity CVEs"
            - "Error: Process completed with exit code 1."

      - id: scout-policy
        name: "Docker Scout — policy gate"
        requires: image_patched
        logs:
          - "$ docker scout policy product-catalog:abc1234 --exit-code"
          - "Policy status  PASS"
          - "✓  5 / 5 policies satisfied"
          - "Exit code: 0"
        failure:
          error: "0 / 5 Scout policies satisfied — image blocked from registry."
          logs:
            - "$ docker scout policy product-catalog:abc1234 --exit-code"
            - "Policy status  FAIL"
            - "✗  0 / 5 policies satisfied"
            - "Error: Process completed with exit code 1."

      - id: push-image
        name: "Push to registry"
        requires: image_patched
        logs:
          - "$ docker push dockersamples/product-catalog:abc1234"
          - "The push refers to repository docker.io/dockersamples/product-catalog"
          - "abc1234: digest: sha256:9f8e7d6c5b4a... size: 1847"
        failure:
          error: "Push skipped — upstream step failed."
          logs:
            - "Step skipped due to upstream failure."

scenarios:

  # ─────────────────────────────────────────
  # DEMO RESET — works from any terminal, any section
  # ─────────────────────────────────────────

  - id: demo-reset
    when:
      command: [demo, reset]
    then:
      state:
        logged_in: false
        org_set: false
        configured_org: "dockerdemo"
        repo_cloned: false
        image_built: false
        services_up: false
        sbx_policy_mode: "org"
        sbx_installed: false
        sbx_started: false
        bug_found: false
        bug_fixed: false
        image_patched: false
      output:
        - "  ╔══════════════════════════════════════════════════════╗"
        - "  ║            Demo Reset — State Cleared                ║"
        - "  ╚══════════════════════════════════════════════════════╝"
        - ""
        - "  ✓  Docker login          cleared"
        - "  ✓  Scout org             reset → dockerdemo"
        - "  ✓  Repository            cleared"
        - "  ✓  Images                cleared"
        - "  ✓  Sandbox policy mode   org (default)"
        - "  ✓  Sandbox               stopped"
        - "  ✓  Bug fix state         cleared"
        - "  ✓  Image patch state     cleared"
        - ""
        - "  Lab is back at initial state."
        - "  Start from Section 2 — Org Setup & Scout Policies."

  # ─────────────────────────────────────────
  # SECTION 2 — Org Setup
  # ─────────────────────────────────────────

  # Specific (with -u flag) BEFORE the bare catch-all — first-match-wins
  - id: docker-login-with-user
    when:
      command: [docker, login]
      args:
        -u: { any: true }
    then:
      state: { logged_in: true }
      output:
        - "Authenticating with existing credentials..."
        - "Login Succeeded"

  - id: docker-login
    when:
      command: [docker, login]
    then:
      state: { logged_in: true }
      output:
        - "Authenticating with existing credentials..."
        - { text: "WARNING! Your password will be stored unencrypted in /root/.docker/config.json.", delay: short }
        - { text: "Configure a credential helper to remove this warning. See", delay: short }
        - { text: "https://docs.docker.com/engine/reference/commandline/login/#credentials-store", delay: short }
        - ""
        - "Login Succeeded"

  - id: docker-scout-enroll
    when:
      command: [docker, scout, enroll]
      args:
        0: { any: true }
    then:
      state: { configured_org: "{{ args.0 }}" }
      output:
        - "    ✓  Successfully enrolled organization '{{ args.0 }}' in Docker Scout"
        - "    ✓  Docker Scout is now active for all repositories in this organization"

  - id: docker-scout-config-org
    when:
      command: [docker, scout, config, organization]
      args:
        0: { any: true }
    then:
      state: { org_set: true, configured_org: "{{ args.0 }}" }
      output:
        - "    ✓  Organization set to '{{ args.0 }}'"
        - ""
        - "Docker Scout will now evaluate images against your organization's policies."
        - "Run 'docker scout policy ls' to see active policies."

  # docker scout policy ls — must come BEFORE the generic `docker scout policy` catch-all
  - id: docker-scout-policy-ls
    when:
      command: [docker, scout, policy, ls]
    then:
      output:
        - "  NAME                                   STATUS    DESCRIPTION"
        - "  ─────────────────────────────────────────────────────────────────────────────────────────"
        - "  No critical or high-profile CVEs       enabled   Fail if critical or high CVEs are present"
        - "  Supply chain attestations              enabled   Require SBOM + provenance attestation"
        - "  No fixable vulnerabilities             enabled   Fail if fixable CVEs exist"
        - "  Approved base images                   enabled   Only allow images from approved registries"
        - "  Default non-root user                  enabled   Container must not run as root"
        - ""
        - "  5 policies active for organization '{{ state.configured_org }}'"
        - "  Manage policies at: https://hub.docker.com/orgs/{{ state.configured_org }}/scout/policies"

  # ─────────────────────────────────────────
  # SECTION 3 — Product Catalog
  # ─────────────────────────────────────────

  - id: git-clone-product-catalog
    when:
      command: [git, clone]
      args:
        0: { any: true }
    then:
      state: { repo_cloned: true }
      output:
        - "Cloning into 'product-catalog'..."
        - { text: "remote: Enumerating objects: 187, done.", delay: clone }
        - "remote: Counting objects: 100% (187/187), done."
        - "remote: Compressing objects: 100% (112/112), done."
        - { text: "Receiving objects: 100% (187/187), 48.3 KiB | 1.2 MiB/s, done.", delay: clone }
        - "Resolving deltas: 100% (63/63), done."

  # ls — scalar string equals (spec §6.2); unlisted paths fall through to built-in ls
  - id: ls-product-catalog
    when:
      command: [ls]
      args:
        0: "product-catalog/"
    then:
      output:
        - "Dockerfile  Dockerfile.dhi  README.md  docker-compose.yml"
        - "package.json  package-lock.json  src/  .github/"

  - id: ls-product-catalog-no-slash
    when:
      command: [ls]
      args:
        0: "product-catalog"
    then:
      output:
        - "Dockerfile  Dockerfile.dhi  README.md  docker-compose.yml"
        - "package.json  package-lock.json  src/  .github/"

  # cat — specific paths override built-in; unlisted paths fall through to built-in cat (reads virtual FS)
  - id: cat-dockerfile
    when:
      command: [cat]
      args:
        0: "product-catalog/Dockerfile"
    then:
      output:
        - "# syntax=docker/dockerfile:1"
        - ""
        - "FROM node:18-alpine AS build"
        - "WORKDIR /app"
        - "COPY package*.json ./"
        - "RUN npm ci --only=production"
        - "COPY src/ ./src/"
        - ""
        - "FROM node:18-alpine"
        - "WORKDIR /app"
        - "COPY --from=build /app ./"
        - "EXPOSE 8080"
        - "CMD [\"node\", \"src/index.js\"]"

  - id: cat-products-route
    when:
      command: [cat]
      args:
        0: "product-catalog/src/routes/products.js"
    then:
      output:
        - "const express = require('express');"
        - "const router = express.Router();"
        - "const db = require('../db');"
        - ""
        - "router.get('/', async (req, res) => {"
        - "  const products = await db.query("
        - "    'SELECT id, name, price, discount_rate, image_url, category FROM products ORDER BY id'"
        - "  );"
        - "  res.json(products.rows);"
        - "});"
        - ""
        - "router.get('/:id', async (req, res) => {"
        - "  const { id } = req.params;"
        - "  const result = await db.query('SELECT * FROM products WHERE id = $1', [id]);"
        - "  const product = result.rows[0];"
        - "  if (!product) return res.status(404).json({ error: 'Not found' });"
        - ""
        - "  // BUG: should be price * (1 - discount_rate)"
        - "  product.final_price = product.price * product.discount_rate;"
        - ""
        - "  res.json(product);"
        - "});"
        - ""
        - "module.exports = router;"

  - id: ci-pipeline-output
    when:
      command: [cat]
      args:
        0: "ci-output.log"
    then:
      output:
        - "Run docker/scout-action@v1"
        - "  with:"
        - "    command: policy"
        - "    image: product-catalog:abc1234"
        - "    exit-code: true"
        - ""
        - "    ✓  Image analyzed: product-catalog:abc1234"
        - "    ✓  Organization: {{ state.configured_org }}"
        - ""
        - "    Policy status  FAIL  ─────────────────────────────────────────"
        - "                   ✗  No critical or high-profile CVEs   FAIL"
        - "                   ✗  Supply chain attestations           FAIL"
        - "                   ✗  No fixable vulnerabilities          FAIL"
        - "                   ✗  Approved base images                FAIL"
        - "                   ✗  Default non-root user               FAIL"
        - ""
        - "    Result: 0 / 5 policies satisfied"
        - ""
        - "Error: Process completed with exit code 1."
        - ""
        - "  ✗ Job 'build' failed at step 'Docker Scout — policy gate'"
        - "  View run at: https://github.com/dockersamples/product-catalog/actions/runs/..."

  # docker build — specific tag match BEFORE the bare catch-all (first-match-wins)
  - id: docker-build-patched
    when:
      command: [docker, build]
      args:
        -t: "product-catalog:dhi"
    then:
      state: { image_patched: true }
      output:
        - "[+] Building 38.1s (12/12) FINISHED                    docker:default"
        - " => [internal] load build definition from Dockerfile.dhi               0.1s"
        - { text: " => [internal] load metadata for dhi.io/node:24-alpine             1.8s", delay: short }
        - { text: " => [build 1/4] FROM dhi.io/node:24-alpine@sha256:7f2c...          3.2s", delay: short }
        - { text: " => [build 2/4] WORKDIR /app                                       0.1s", delay: short }
        - { text: " => [build 3/4] COPY package*.json ./                              0.2s", delay: short }
        - { text: " => [build 4/4] RUN npm ci --only=production                      16.9s", delay: build }
        - { text: " => [stage-2 1/3] COPY --from=build /app ./                        0.2s", delay: short }
        - { text: " => exporting to image                                              1.4s", delay: short }
        - " => => naming to docker.io/library/product-catalog:dhi"
        - ""
        - "    ✓  Base image: dhi.io/node:24-alpine (FIPS + STIG)"
        - "    ✓  Image size: 142MB (vs 198MB with node:18-alpine)"
        - ""
        - "What's next:"
        - "    Verify the fix → docker scout policy product-catalog:dhi"

  - id: docker-build-product-catalog
    when:
      command: [docker, build]
    then:
      state: { image_built: true }
      output:
        - "[+] Building 42.3s (12/12) FINISHED                    docker:default"
        - " => [internal] load build definition from Dockerfile                 0.1s"
        - " => => transferring dockerfile: 312B                                 0.0s"
        - " => [internal] load .dockerignore                                    0.0s"
        - { text: " => [internal] load metadata for docker.io/library/node:18-alpine  2.1s", delay: short }
        - " => [build 1/4] FROM docker.io/library/node:18-alpine@sha256:a4b...  0.0s"
        - { text: " => [build 2/4] WORKDIR /app                                        0.1s", delay: short }
        - { text: " => [build 3/4] COPY package*.json ./                               0.2s", delay: short }
        - { text: " => [build 4/4] RUN npm ci --only=production                       18.4s", delay: build }
        - { text: " => [stage-2 1/2] COPY --from=build /app ./                        0.3s", delay: short }
        - " => exporting to image                                               1.8s"
        - " => => exporting layers                                              1.7s"
        - " => => writing image sha256:3f8c...                                  0.0s"
        - " => => naming to docker.io/library/product-catalog:latest            0.0s"
        - ""
        - " View build details: docker-desktop://dashboard/build/..."
        - ""
        - "What's next:"
        - "    View a summary of image vulnerabilities and recommendations → docker scout quickview product-catalog:latest"

  - id: docker-compose-up
    when:
      command: [docker, compose, up]
    then:
      state: { services_up: true }
      output:
        - "[+] Running 3/3"
        - { text: " ✔ Network product-catalog_default       Created          0.1s", delay: short }
        - { text: " ✔ Container product-catalog-postgres-1  Healthy          2.3s", delay: short }
        - { text: " ✔ Container product-catalog-app-1       Started          2.6s", delay: short }
        - ""
        - "product-catalog-app-1  | Server running on http://0.0.0.0:8080"
        - "product-catalog-app-1  | Database connected: postgresql://localhost/products"
        - "product-catalog-app-1  | Loaded 12 products from seed data"

  # curl — specific paths first; scalar string equals (spec §6.2)
  - id: curl-product-item
    when:
      command: [curl]
      args:
        0: "http://localhost:8080/api/products/1"
    then:
      output:
        - "{"
        - "  \"id\": 1,"
        - "  \"name\": \"Widget Pro\","
        - "  \"price\": 99.99,"
        - "  \"discount_rate\": 0.2,"
        - "  \"category\": \"tools\","
        - "  \"image_url\": \"/images/widget-pro.png\","
        - "  \"final_price\": 20.00"
        - "}"
        - ""
        - "# NOTE: Something looks wrong!"
        - "# price=$99.99, discount=20% → final_price should be $79.99"
        - "# But final_price shows $20.00 (price * discount_rate instead of price * (1 - discount_rate))"

  - id: curl-product-2
    when:
      command: [curl]
      args:
        0: "http://localhost:8080/api/products/4"
    then:
      output:
        - "{"
        - "  \"id\": 4,"
        - "  \"name\": \"Thingamajig Plus\","
        - "  \"price\": 199.99,"
        - "  \"discount_rate\": 0.25,"
        - "  \"final_price\": 50.00"
        - "}"
        - ""
        - "# price=$199.99, discount=25% → should be $149.99, showing $50.00 ← BUG"

  - id: curl-products-list
    when:
      command: [curl]
      args:
        0: "http://localhost:8080/api/products"
    then:
      output:
        - "["
        - "  {\"id\":1,\"name\":\"Widget Pro\",\"price\":99.99,\"discount_rate\":0.2,\"category\":\"tools\",\"image_url\":\"/images/widget-pro.png\"},"
        - "  {\"id\":2,\"name\":\"Gadget Ultra\",\"price\":149.99,\"discount_rate\":0.15,\"category\":\"electronics\",\"image_url\":\"/images/gadget-ultra.png\"},"
        - "  {\"id\":3,\"name\":\"Doohickey Deluxe\",\"price\":49.99,\"discount_rate\":0.0,\"category\":\"accessories\",\"image_url\":\"/images/doohickey.png\"},"
        - "  {\"id\":4,\"name\":\"Thingamajig Plus\",\"price\":199.99,\"discount_rate\":0.25,\"category\":\"tools\",\"image_url\":\"/images/thingamajig.png\"},"
        - "  ... (12 products total)"
        - "]"

  - id: docker-scout-quickview
    when:
      command: [docker, scout, quickview]
      args:
        0: { any: true }
    then:
      output:
        - "    i  New version 1.14.0 available (installed version is 1.11.0) at https://github.com/docker/scout-cli"
        - "        Image │  product-catalog:latest"
        - "    Analyzed │  77 packages"
        - "  Base image │  node:18-alpine"
        - "  Refreshed │  1 minute ago"
        - ""
        - "    ✗ Critical  3"
        - "    ✗ High     11"
        - "    ~ Medium   29"
        - "    ✓ Low       4"
        - ""
        - "  Packages at risk │  43 / 77"
        - ""
        - "What's next?"
        - "    View base image update recommendations → docker scout recommendations product-catalog:latest"
        - "    Include policy results in your quickview → docker scout quickview --org {{ state.configured_org }} product-catalog:latest"

  # docker scout cves — specific image args BEFORE the any catch-all (first-match-wins)
  # Image name moved from command array to args (spec §6.1: command is prefix only)
  - id: docker-scout-cves-catalog
    when:
      command: [docker, scout, cves]
      args:
        0: "product-catalog:latest"
    then:
      output:
        - "    ✓ SBOM of image already cached, 77 packages indexed"
        - "    ✓ Pulled"
        - "    ✗ Found 3 critical, 11 high, 29 medium, 4 low vulnerabilities"
        - ""
        - "   ╭──────────────────────────────────────────────────────────────────────────────╮"
        - "   │                          Vulnerability summary                               │"
        - "   ├───────────────────┬──────────────────────────────────────────────────────────┤"
        - "   │ Severity          │ 3 CRITICAL │ 11 HIGH │ 29 MEDIUM │ 4 LOW                 │"
        - "   │ Fixable           │ 3 CRITICAL │  9 HIGH │ 21 MEDIUM │ 2 LOW                 │"
        - "   │ Base image        │ node:18-alpine                                           │"
        - "   ╰───────────────────┴──────────────────────────────────────────────────────────╯"
        - ""
        - "   CRITICAL Vulnerabilities"
        - "   ─────────────────────────────────────────────────────────────────────────────"
        - "   Package       CVE ID           Severity  Fixed In  CVSS  Description"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   openssl       CVE-2024-0727    CRITICAL  3.2.1     9.1   PKCS12 null ptr dereference"
        - "   libssl3       CVE-2023-5363    CRITICAL  3.1.4     9.1   AES-SIV cipher misuse"
        - "   busybox       CVE-2023-42363   CRITICAL  1.36.1    9.8   awk use-after-free"
        - ""
        - "   HIGH Vulnerabilities"
        - "   ─────────────────────────────────────────────────────────────────────────────"
        - "   Package       CVE ID           Severity  Fixed In  CVSS  Description"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   curl          CVE-2023-38545   HIGH      8.3.0     8.1   Heap overflow in SOCKS5"
        - "   libcurl       CVE-2023-38546   HIGH      8.3.0     4.2   Cookie injection in SOCKS5"
        - "   nghttp2       CVE-2023-44487   HIGH      1.57.0    7.5   HTTP/2 Rapid Reset"
        - "   npm           CVE-2024-21538   HIGH      10.8.3    7.4   cross-spawn ReDoS"
        - "   node          CVE-2024-22019   HIGH      20.11.1   7.5   HTTP request smuggling"
        - "   libc-utils    CVE-2023-5156    HIGH      0.7.2-r4  7.5   free() invalid pointer"
        - "   musl          CVE-2024-3067    HIGH      1.2.5-r2  7.3   Stack overflow in printf"
        - "   zlib          CVE-2023-45853   HIGH      1.3.1     9.8   MiniZip integer overflow"
        - "   libexpat      CVE-2023-52425   HIGH      2.6.2     7.5   Billion laughs attack"
        - "   libxml2       CVE-2024-25062   HIGH      2.12.5    7.5   Use-after-free in reader"
        - "   tar           CVE-2023-39804   HIGH      1.35      7.1   Out-of-bounds read"
        - ""
        - "   ... and 29 MEDIUM, 4 LOW vulnerabilities"
        - ""
        - "What's next?"
        - "    Check base image recommendations → docker scout recommendations product-catalog:latest"
        - "    Explore remediation → https://scout.docker.com/reports/..."

  - id: docker-scout-cves-dhi-node
    when:
      command: [docker, scout, cves]
      args:
        0: "dhi.io/node:24-alpine"
    then:
      output:
        - "    ✓ SBOM of image already cached, 61 packages indexed"
        - "    ✓ Pulled"
        - "    ✓ No critical vulnerabilities found"
        - "    ✓ No high vulnerabilities found"
        - ""
        - "   ╭──────────────────────────────────────────────────────────────────────────────╮"
        - "   │                          Vulnerability summary                               │"
        - "   ├───────────────────┬──────────────────────────────────────────────────────────┤"
        - "   │ Severity          │ 0 CRITICAL │ 0 HIGH │ 2 MEDIUM │ 1 LOW                  │"
        - "   │ Fixable           │ 0 CRITICAL │ 0 HIGH │ 0 MEDIUM │ 0 LOW                  │"
        - "   │ Base image        │ dhi.io/node:24-alpine (FIPS validated, STIG hardened)   │"
        - "   ╰───────────────────┴──────────────────────────────────────────────────────────╯"
        - ""
        - "   MEDIUM Vulnerabilities (non-fixable, suppressed by VEX)"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   Package   CVE ID           Severity  Status        Description"
        - "   ──────────────────────────────────────────────────────────────────────────────"
        - "   libssl3   CVE-2024-5535    MEDIUM    not_affected  VEX: not reachable in this build"
        - "   openssl   CVE-2024-4603    MEDIUM    not_affected  VEX: DHI team reviewed, mitigated"
        - ""
        - "    ✓ 0 fixable CVEs — no action required"
        - "    ✓ FIPS 140-2 validated cryptographic modules"
        - "    ✓ STIG-hardened base (CIS Benchmark Level 2)"
        - "    ✓ SBOM + provenance attestations present"

  # Catch-all for any other image — must come AFTER specific image scenarios
  - id: docker-scout-cves-image-any
    when:
      command: [docker, scout, cves]
      args:
        0: { any: true }
    then:
      output:
        - "    ✓ Analyzing {{ args.0 }}..."
        - "    ✓ SBOM indexed, 77 packages found"
        - "    ✗ Found 3 critical, 11 high vulnerabilities"
        - ""
        - "    Run with a specific image tag for detailed results."

  # docker scout policy — specific images BEFORE catch-all (first-match-wins)
